function updateTipos(abEdit) {
  const linea = document.getElementById('m_linea')?.value;
  const tipos = getTiposLinea(linea);
  const sel = document.getElementById('m_tipo');
  if (!sel) return;
  sel.innerHTML = tipos.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');
  if (abEdit && abEdit.tipo_id) sel.value = abEdit.tipo_id;
  updateParams(abEdit);
}

function updateParams(abEdit) {
  abEdit = abEdit || (window._editandoAberturaId ? state.aberturas.find(x => x.id === window._editandoAberturaId) : null);
  const _editParams = abEdit ? tryParse(abEdit.params, {}) : {};
  const linea = document.getElementById('m_linea')?.value;
  const tipoId = document.getElementById('m_tipo')?.value;
  const tipos = getTiposLinea(linea);
  const tipo = tipos.find(t => t.id === tipoId);
  const wrap = document.getElementById('m_params');
  if (!wrap || !tipo) return;
  wrap.innerHTML = (tipo.params || []).map(p => `
    <div class="form-group">
      <label>${p.nombre}</label>
      <input type="number" id="param_${p.id}" value="${_editParams[p.id] ?? p.default}" min="${p.min}" max="${p.max}" style="width:100px" oninput="previewCalc()">
    </div>`).join('');
  // Show/hide tablillas section based on tipologia config
  const cfgTipo = getConfigTipo(linea, tipoId);
  const tabWrap = document.getElementById('m_tablillas_wrap');
  if (tabWrap) tabWrap.style.display = cfgTipo?.tablillas?.enabled ? '' : 'none';
  if (cfgTipo?.tablillas?.enabled && _editParams.pct_tablillas) {
    const _pctInput = document.getElementById('m_pct_tablillas');
    if (_pctInput) _pctInput.value = _editParams.pct_tablillas;
    const _tabRadio = document.querySelector(`input[name="m_tab_pos"][value="${_editParams.tab_pos || 'abajo'}"]`);
    if (_tabRadio) _tabRadio.checked = true;
  }
  // Show/hide premarco based on linea config
  const cfgPm = getConfigPremarco(linea);
  const pmWrap = document.getElementById('m_premarco_wrap');
  if (pmWrap) pmWrap.style.display = cfgPm?.perfil_codigo ? '' : 'none';
  if (_editParams.con_premarco) {
    const _pmCheck = document.getElementById('m_con_premarco');
    if (_pmCheck) _pmCheck.checked = true;
  }
  updatePrecioVidrio();
  if (_editParams.subtipo_vidrio_id) {
    const _vidSel = document.getElementById('m_subtipo_vidrio');
    if (_vidSel) _vidSel.value = _editParams.subtipo_vidrio_id;
  }
  previewCalc();
}

function getPrecioKgPresupuesto(p) {
  let precioKg = Number(p?.precio_kg) || 0;
  if (!precioKg && p) {
    const match = state.precios_kg.find(pk =>
      pk.linea_id === p.linea_id &&
      pk.tipo === p.tipo_al &&
      pk.nombre === p.color_al
    );
    precioKg = Number(match?.precio_kg) || 0;
  }
  return precioKg;
}

function previewCalc() {
  const linea  = document.getElementById('m_linea')?.value;
  const tipoId = document.getElementById('m_tipo')?.value;
  const W      = parseInt(document.getElementById('m_ancho')?.value);
  const H      = parseInt(document.getElementById('m_alto')?.value);
  const cant   = parseInt(document.getElementById('m_cant')?.value) || 1;
  const tv     = document.querySelector('input[name="m_tipo_vidrio"]:checked')?.value || 'vcomon';
  // Calcular precio vidrio directamente desde config segun tipo seleccionado
  const pVidInput = document.getElementById('m_pvid');
  const pVidUserModified = pVidInput?.dataset.userModified === '1';
  // El precio viene del tipo de vidrio seleccionado, o del input si el usuario lo modificó
  const subtipoIdPv = document.getElementById('m_subtipo_vidrio')?.value;
  const subtipoPv = state.tipos_vidrio?.find(t => t.id === subtipoIdPv);
  const pVid = pVidUserModified
    ? (parseFloat(pVidInput?.value) || 8500)
    : (subtipoPv ? subtipoPv.precio : (parseFloat(pVidInput?.value) || 8500));
  if (!pVidUserModified && pVidInput) pVidInput.value = pVid;
  const preview = document.getElementById('m_preview');
  const btnAb   = document.getElementById('btnAgregarAb');
  if (!preview) return;
  if (!W || !H || !linea || !tipoId) { preview.innerHTML = ''; if (btnAb) btnAb.disabled = true; return; }
  // Update premarco info
  const _cfgPmPrev = getConfigPremarco(linea);
  const _pmInfoEl = document.getElementById('m_premarco_info');
  const _conPm = document.getElementById('m_con_premarco')?.checked;
  if (_pmInfoEl && _cfgPmPrev?.perfil_codigo && W && H) {
    if (_conPm) {
      const _pmMetros = Math.round(2*(W+H)/1000 * 100) / 100;
      _pmInfoEl.textContent = '→ ' + _pmMetros + ' m perimetral';
    } else {
      _pmInfoEl.textContent = '';
    }
  }
  // Update tablillas info
  const _cfgTabPrev = getConfigTipo(linea, tipoId);
  if (_cfgTabPrev?.tablillas?.enabled) {
    const _pctTabPrev = Number(document.getElementById('m_pct_tablillas')?.value) || 0;
    const _infoEl = document.getElementById('m_tablillas_info');
    if (_infoEl && _pctTabPrev > 0) {
      const _hoja_h = H; // approximate
      const _altoZonaTab = Math.round(_hoja_h * _pctTabPrev / 100);
      const _altoZonaVid = _hoja_h - _altoZonaTab;
      const _altoTab = Number(_cfgTabPrev.tablillas.alto_tablilla) || 80;
      const _nTab = Math.max(1, Math.floor(_altoZonaTab / _altoTab));
      _infoEl.textContent = '→ ' + _nTab + ' tablillas · vidrio ' + _altoZonaVid + 'mm alto';
    } else if (_infoEl) {
      _infoEl.textContent = '';
    }
  }

  const p = state.presupuestos.find(x => x.id === state.presupuestoActivo);
  const precioKg = getPrecioKgPresupuesto(p);
  const criterio = state._criterioPrecio || 'barra_completa';

  // Simular abertura nueva junto con las existentes para calcular costo real
  const absExistentes = state.aberturas.filter(a => a.presupuesto_id === state.presupuestoActivo);
  const tipos = getTiposLinea(linea);
  const tipo  = tipos.find(t => t.id === tipoId);
  if (!tipo) return;
  const params = {};
  (tipo.params || []).forEach(pa => { params[pa.id] = parseInt(document.getElementById(`param_${pa.id}`)?.value) || pa.default; });

  // Abertura simulada (id temporal)
  const _pctTabPv = Number(document.getElementById('m_pct_tablillas')?.value) || 0;
  const _tabPosPv = document.querySelector('input[name="m_tab_pos"]:checked')?.value || 'abajo';
  const paramsPreview = { ...params, tipo_vidrio: tv,
    ...(_pctTabPv > 0 ? { pct_tablillas: _pctTabPv, tab_pos: _tabPosPv } : {}) };
  const abSimulada = {
    id: '__preview__',
    presupuesto_id: state.presupuestoActivo,
    linea_id: linea,
    tipo_id: tipoId,
    ancho: W, alto: H, cantidad: cant,
    params: JSON.stringify(paramsPreview),
    precio_vidrio: pVid,
    vidrios: '[]',
  };
  const todasConNueva = [...absExistentes, abSimulada];

  // Calcular con criterio seleccionado
  const { costos } = calcularCostoAberturas(todasConNueva, state.perfiles, state.herrajes, precioKg, criterio, state.umbral_sobrante);
  const cNueva = costos['__preview__'] || { perfiles: 0, vidrios: 0, herrajes: 0 };

  // También calcular vidrios de la nueva abertura (con tipo_vidrio en params)
  const paramsConTv = { ...params, tipo_vidrio: tv,
    ...(_pctTabPv > 0 ? { pct_tablillas: _pctTabPv, tab_pos: _tabPosPv } : {}) };
  const resBase = calcularAbertura(linea, tipoId, W, H, paramsConTv, state.perfiles, state.herrajes, pVid, precioKg, {});
  const vidrios = resBase ? resBase.vidrios : [];
  const costoVidrios = vidrios.reduce((s, v) => s + (v.ancho/1000)*(v.alto/1000)*pVid, 0);

  // Obtener detalle de perfiles para mostrar (con tipo_vidrio para filtrar correctamente)
  const cortesRaw = getCortesRaw(linea, tipoId, W, H, paramsConTv, state.perfiles);
  const perfilesFiltrados = state.perfiles.filter(pf => pf.linea_id === linea);
  const perfilesUsados = [...new Set(cortesRaw.filter(c => c.perfil).map(c => c.perfil.codigo || c.perfil.id))];
  const mmTotal = cortesRaw.filter(c => c.perfil).reduce((s, c) => s + c.largo * c.cantidad, 0);

  const filas = perfilesUsados.map(k => {
    const perfil = perfilesFiltrados.find(pf => pf.codigo === k || pf.id === k);
    if (!perfil) return '';
    // mm de 1 unidad, luego multiplicar por cant para mostrar el total real
    const mmEste1u = cortesRaw.filter(c => c.perfil && (c.perfil.codigo === k || c.perfil.id === k))
      .reduce((s, c) => s + c.largo * c.cantidad, 0);
    const mmEste = mmEste1u * cant;
    const fraccion = mmTotal > 0 ? mmEste1u / mmTotal : 0;
    const costoEste = cNueva.perfilesPorCodigo?.[k] || (cNueva.perfiles * fraccion);

    // Verificar si aprovecha sobrante
    const barrasExist = getBarrasExistentes(absExistentes, state.perfiles);
    const barrasDeEste = barrasExist[k] || [];
    const mmDisponible = barrasDeEste.reduce((s, b) => s + (b.resto || 0), 0);
    const esAhorro = criterio === 'proporcional' && mmDisponible >= mmEste;
    const iconoAhorro = esAhorro ? '<span style="color:#00E5A0;font-size:10px;margin-left:6px;">✓ aprovecha sobrante</span>' : '';

    return `<div class="preview-row">
      <span>[${k}] ${perfil.nombre}${iconoAhorro}</span>
      <span style="color:var(--text3)">${mmEste}mm${cant > 1 ? ' ('+cant+'u.)' : ''}</span>
      <span style="color:${esAhorro?'#00E5A0':'var(--text)'}">${fmt(costoEste)}</span>
    </div>`;
  }).join('');

  const vidFilas = vidrios.map(v => `
    <div class="preview-row">
      <span>${v.desc} (${v.ancho}x${v.alto}mm)${cant > 1 ? ' ×'+cant : ''}</span>
      <span style="color:var(--text3)">${((v.ancho/1000)*(v.alto/1000)*cant).toFixed(2)}m²</span>
      <span>${fmt((v.ancho/1000)*(v.alto/1000)*pVid*cant)}</span>
    </div>`).join('');

  // cNueva ya viene con el costo total para N unidades desde calcularCostoAberturas
  const costoTotal = cNueva.perfiles + (costoVidrios * cant) + cNueva.herrajes;
  const criterioLabel = criterio === 'proporcional' ? 'precio proporcional' : 'precio perfil completo';

  preview.innerHTML = `
    <div class="preview-box">
      <div class="preview-title">Vista previa · ${fmt(precioKg)}/kg · ${criterioLabel}</div>
      ${filas}${vidFilas}
      <div class="preview-total"><span>Total x ${cant} u.</span><span>${fmt(costoTotal)}</span></div>
    </div>`;
  if (btnAb) btnAb.disabled = false;
}

async function confirmarAgregarAbertura() {
  const btn = document.getElementById('btnAgregarAb');
  setBtnLoading(btn, true, 'Calculando...');
  try {
    const linea_id = document.getElementById('m_linea')?.value;
    const tipoId   = document.getElementById('m_tipo')?.value;
    const W        = parseInt(document.getElementById('m_ancho')?.value);
    const H        = parseInt(document.getElementById('m_alto')?.value);
    const cant     = parseInt(document.getElementById('m_cant')?.value) || 1;
    const pVid     = parseFloat(document.getElementById('m_pvid')?.value) || 8500;
    const nomenclatura = (document.getElementById('m_nomenclatura')?.value || '').trim();
    if (!W || !H) { setBtnLoading(btn, false); return; }

    const p = state.presupuestos.find(x => x.id === state.presupuestoActivo);
    const precioKg = getPrecioKgPresupuesto(p);
    const tipos = getTiposLinea(linea_id);
    const tipo = tipos.find(t => t.id === tipoId);
    const params = {};
    (tipo?.params || []).forEach(pa => { params[pa.id] = parseInt(document.getElementById(`param_${pa.id}`)?.value) || pa.default; });

    const subtipoId = document.getElementById('m_subtipo_vidrio')?.value;
    const subtipoObj = state.tipos_vidrio?.find(t => t.id === subtipoId);
    const tipoVidrio = subtipoObj?.tipo_base || 'vcomon';
    params.tipo_vidrio = tipoVidrio;
    if (subtipoObj) {
      params.subtipo_vidrio_id = subtipoObj.id;
      params.subtipo_vidrio_nombre = subtipoObj.nombre;
    }

    // Premarco
    const _cfgPmSnap = getConfigPremarco(linea_id);
    const _conPmSnap = document.getElementById('m_con_premarco')?.checked;
    if (_cfgPmSnap?.perfil_codigo && _conPmSnap) {
      params.con_premarco = true;
    }
    // Tablillas
    const _cfgTabSnap = getConfigTipo(linea_id, tipoId);
    if (_cfgTabSnap?.tablillas?.enabled) {
      const _pctTab = Number(document.getElementById('m_pct_tablillas')?.value) || 0;
      if (_pctTab > 0) {
        params.pct_tablillas = _pctTab;
        params.tab_pos = document.querySelector('input[name="m_tab_pos"]:checked')?.value || 'abajo';
      }
    }

    const absExistentes = state.aberturas.filter(a => a.presupuesto_id === state.presupuestoActivo);
    const barrasExistentes = getBarrasExistentes(absExistentes, state.perfiles);
    const res = calcularAbertura(linea_id, tipoId, W, H, params, state.perfiles, state.herrajes, pVid, precioKg, barrasExistentes);
    if (!res) { toast('Error al calcular la abertura', 'error'); setBtnLoading(btn, false); return; }

    const linea = state.lineas.find(l => l.id === linea_id);

    // Snapshot de perfiles al momento de carga (congela peso y precio/kg)
    const perfilesSnap = state.perfiles
      .filter(pf => pf.linea_id === linea_id)
      .map(pf => ({ id: pf.id, linea_id: pf.linea_id, codigo: pf.codigo, nombre: pf.nombre, peso_tira: pf.peso_tira, largo_barra: pf.largo_barra }));

    // Snapshot de herrajes al momento de carga (congela precio)
    const herrajesCalcSnap = getHerrajesTipo(linea_id, tipoId, { ...params, ancho: W, alto: H });
    const herrajesSnap = herrajesCalcSnap.map(h => {
      const hObj = state.herrajes.find(x => x.id === h.id);
      return { id: h.id, nombre: hObj?.nombre || h.descripcion || h.id, cantidad: h.cantidad, precio: Number(hObj?.precio || 0), unidad: hObj?.unidad || 'u' };
    });

    const ab = {
      id: genId(),
      presupuesto_id: state.presupuestoActivo,
      linea_id,
      linea: linea?.nombre || linea_id,
      tipo_id: tipoId,
      nombre: `${linea?.nombre} - ${tipo?.nombre}`,
      nomenclatura,
      ancho: W, alto: H, cantidad: cant,
      params: JSON.stringify(params),
      precio_vidrio: pVid,
      precio_kg: precioKg,
      costo_perfiles: res.costoPerfiles,
      costo_vidrios:  res.costoVidrios,
      costo_herrajes: res.costoHerrajes,
      optimizacion: JSON.stringify(res.optimizacion),
      vidrios:      JSON.stringify(res.vidrios),
      perfiles_snap: JSON.stringify(perfilesSnap),
      herrajes_snap: JSON.stringify(herrajesSnap),
    };
    if (window._editandoAberturaId) {
      ab.id = window._editandoAberturaId;
      const idx = state.aberturas.findIndex(x => x.id === window._editandoAberturaId);
      if (idx >= 0) state.aberturas[idx] = ab;
      await sheetsUpdateRow(SHEETS.aberturas, ab.id, ab);
      window._editandoAberturaId = null;
    } else {
      state.aberturas.push(ab);
      await sheetsAppend(SHEETS.aberturas, ab);
    }

    await recalcularTotal();
    closeModal();
    toast('Abertura agregada');
  } catch(e) {
    toast('Error al agregar abertura', 'error');
    setBtnLoading(btn, false);
  } finally {
    render();
  }
}

async function crearStock() {
  const perfilId = document.getElementById('m_s_perfil')?.value;
  const largo = document.getElementById('m_s_largo')?.value;
  const nota = document.getElementById('m_s_nota')?.value;

  const perfil = state.perfiles.find(p => p.id === perfilId);
  const linea = state.lineas.find(l => l.id === perfil?.linea_id);
  const s = { id: genId(), perfil_id: perfilId, perfil_nombre: perfil?.nombre || '', linea: linea?.nombre || '', largo_mm: largo, nota, fecha: today() };
  state.stock.push(s);
  await sheetsAppend(SHEETS.stock, s);
  closeModal(); toast('Sobrante registrado'); render();
}

// ============================================================
// SVG DESCRIPTIVOS POR TIPO DE ABERTURA (con proporciones reales)
// ============================================================
function svgAbertura(tipo_id, anchoMm, altoMm, maxW, maxH, params) {
  // Resolver tipo de dibujo para tipologías custom
  const _BUILTINS = ['ventana-corrediza','puerta-abrir','puerta-corrediza','puerta-ventana-corrediza','pano-fijo','ventana-abrir','banderola','ventana-dvh','pano-fijo-dvh','puerta-ventana-abrir'];
  if (!_BUILTINS.includes(tipo_id)) {
    const _customMeta = state.tipologias_custom.find(t => t.id === tipo_id);
    if (_customMeta) {
      const _n = (_customMeta.nombre || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if      (_n.includes('corrediza') && _n.includes('puerta ventana')) tipo_id = 'puerta-ventana-corrediza';
      else if (_n.includes('corrediza') && _n.includes('puerta'))         tipo_id = 'puerta-corrediza';
      else if (_n.includes('corrediza'))                                   tipo_id = 'ventana-corrediza';
      else if (_n.includes('abrir') && _n.includes('puerta ventana'))     tipo_id = 'puerta-ventana-abrir';
      else if (_n.includes('abrir') && _n.includes('puerta'))             tipo_id = 'puerta-abrir';
      else if (_n.includes('abrir'))                                       tipo_id = 'ventana-abrir';
      else if (_n.includes('oscilobatiente') || _n.includes('oscilo'))    tipo_id = 'ventana-abrir';
      else if (_n.includes('pano fijo') || _n.includes('fijo'))           tipo_id = 'pano-fijo';
      else if (_n.includes('banderola'))                                   tipo_id = 'banderola';
      else if (_n.includes('dvh'))                                         tipo_id = 'ventana-dvh';
    }
  }
  // Calcular dimensiones respetando la proporción real de la abertura
  maxW = maxW || 160;
  maxH = maxH || 200;
  const ratio = anchoMm / altoMm;
  let W, H;
  if (ratio >= 1) {
    // Más ancha que alta
    W = maxW;
    H = Math.round(maxW / ratio);
    if (H > maxH) { H = maxH; W = Math.round(maxH * ratio); }
  } else {
    // Más alta que ancha (puertas, etc.)
    H = maxH;
    W = Math.round(maxH * ratio);
    if (W > maxW) { W = maxW; H = Math.round(maxW / ratio); }
  }
  // Asegurar mínimos
  W = Math.max(W, 40); H = Math.max(H, 40);

  const pad = 6;
  const iW = W - pad*2;  // interior width
  const iH = H - pad*2;  // interior height
  const cx = W/2, cy = H/2;
  const fc = '#1e3a5f';   // frame color
  const gc = '#0ea5e9';   // glass/detail color
  const gf = '#dbeafe';   // glass fill
  const sw = Math.max(2, Math.round(Math.min(W,H)/30)); // stroke adaptivo

  const label = anchoMm + 'x' + altoMm + 'mm';
  const labelY = H + 14;
  const totalH = H + 18;

  let interior = '';

  if (tipo_id === 'ventana-corrediza') {
    const N_hojas = Number(params?.hojas) || 2;
    const hojaW = Math.round(iW / N_hojas);
    interior = '';
    for (let hi = 0; hi < N_hojas; hi++) {
      const bx = pad + 2 + hi * hojaW;
      const bw = hojaW - 2;
      const by = pad + 2, bh = iH - 4;
      interior += '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5" opacity="0.8"/>';
      // flecha deslizamiento (alterna dirección)
      if (hi % 2 === 0) {
        interior += '<line x1="'+(bx+6)+'" y1="'+cy+'" x2="'+(bx+bw-6)+'" y2="'+cy+'" stroke="'+gc+'" stroke-width="1.5" stroke-dasharray="3,2"/>';
        interior += '<circle cx="'+(bx+bw-8)+'" cy="'+cy+'" r="2.5" fill="'+gc+'"/>';
      } else {
        interior += '<line x1="'+(bx+bw-6)+'" y1="'+cy+'" x2="'+(bx+6)+'" y2="'+cy+'" stroke="'+gc+'" stroke-width="1.5" stroke-dasharray="3,2"/>';
        interior += '<circle cx="'+(bx+8)+'" cy="'+cy+'" r="2.5" fill="'+gc+'"/>';
      }
      // divisor entre hojas
      if (hi < N_hojas - 1) {
        interior += '<line x1="'+(bx+hojaW)+'" y1="'+pad+'" x2="'+(bx+hojaW)+'" y2="'+(H-pad)+'" stroke="'+fc+'" stroke-width="'+sw+'"/>';
      }
    }
  }
  else if (tipo_id === 'puerta-abrir') {
    const N_hojas = Number(params?.hojas) || 1;
    const hojaW = Math.round(iW / N_hojas);
    interior = '';
    for (let hi = 0; hi < N_hojas; hi++) {
      const bx = pad + 2 + hi * hojaW;
      const by = pad + 2;
      const bw = hojaW - 2;
      const bh = iH - 4;
      const r = Math.min(bw, bh) * 0.75;
      // Hoja
      interior += '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5"/>';
      // Arco de apertura alternado (par izquierda, impar derecha) + manija del lado de apertura
      if (hi % 2 === 0) {
        interior += '<path d="M '+(bx+bw)+' '+by+' A '+r+' '+r+' 0 0 0 '+bx+' '+(by+r)+'" fill="none" stroke="'+gc+'" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>';
        interior += '<circle cx="'+(bx+bw-6)+'" cy="'+(by+bh/2)+'" r="3" fill="'+gc+'"/>';
        interior += '<rect x="'+(bx+bw-4)+'" y="'+(by+bh/2-7)+'" width="3" height="14" rx="1.5" fill="'+fc+'"/>';
      } else {
        interior += '<path d="M '+bx+' '+by+' A '+r+' '+r+' 0 0 1 '+(bx+bw)+' '+(by+r)+'" fill="none" stroke="'+gc+'" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>';
        interior += '<circle cx="'+(bx+6)+'" cy="'+(by+bh/2)+'" r="3" fill="'+gc+'"/>';
        interior += '<rect x="'+(bx+1)+'" y="'+(by+bh/2-7)+'" width="3" height="14" rx="1.5" fill="'+fc+'"/>';
      }
      // Divisor entre hojas
      if (hi < N_hojas - 1) {
        interior += '<line x1="'+(bx+bw)+'" y1="'+pad+'" x2="'+(bx+bw)+'" y2="'+(H-pad)+'" stroke="'+fc+'" stroke-width="'+sw+'"/>';
      }
    }
  }
  else if (tipo_id === 'puerta-corrediza') {
    const mid = pad + iW/2;
    interior = ''
      // hoja frontal (más oscura)
      + '<rect x="'+(pad+2)+'" y="'+(pad+2)+'" width="'+(iW/2-2)+'" height="'+(iH-4)+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="2"/>'
      // hoja trasera (más transparente)
      + '<rect x="'+(mid)+'" y="'+(pad+4)+'" width="'+(iW/2-2)+'" height="'+(iH-8)+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1" opacity="0.4"/>'
      // flecha
      + '<line x1="'+(pad+8)+'" y1="'+cy+'" x2="'+(mid-4)+'" y2="'+cy+'" stroke="'+gc+'" stroke-width="1.5" stroke-dasharray="3,2"/>'
      + '<circle cx="'+(mid-8)+'" cy="'+cy+'" r="3" fill="'+gc+'"/>';
  }
  else if (tipo_id === 'puerta-ventana-corrediza') {
    const N_hojas = Number(params?.hojas) || 2;
    interior = '';
    for (let hi = 0; hi < N_hojas; hi++) {
      const hojaW = Math.round(iW / N_hojas);
      const bx = pad + 2 + hi * hojaW;
      const bw = hojaW - 2;
      const by = pad + 2;
      const bh = iH - 4;
      // Hoja
      interior += '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="'+(hi===0?'2':'1.5')+'" opacity="'+(hi===0?'1':'0.7')+'"/>';
      // Zócalo alto (franja inferior)
      interior += '<rect x="'+bx+'" y="'+(by+bh-Math.round(bh*0.15))+'" width="'+bw+'" height="'+Math.round(bh*0.15)+'" fill="#bfdbfe" stroke="'+gc+'" stroke-width="1" opacity="0.8"/>';
      // Flecha deslizamiento
      if (hi % 2 === 0) {
        interior += '<line x1="'+(bx+6)+'" y1="'+(by+bh/2)+'" x2="'+(bx+bw-6)+'" y2="'+(by+bh/2)+'" stroke="'+gc+'" stroke-width="1.5" stroke-dasharray="3,2"/>';
        interior += '<circle cx="'+(bx+bw-8)+'" cy="'+(by+bh/2)+'" r="3" fill="'+gc+'"/>';
      } else {
        interior += '<line x1="'+(bx+bw-6)+'" y1="'+(by+bh/2)+'" x2="'+(bx+6)+'" y2="'+(by+bh/2)+'" stroke="'+gc+'" stroke-width="1.5" stroke-dasharray="3,2"/>';
        interior += '<circle cx="'+(bx+8)+'" cy="'+(by+bh/2)+'" r="3" fill="'+gc+'"/>';
      }
      // Divisor entre hojas
      if (hi < N_hojas - 1) {
        interior += '<line x1="'+(bx+hojaW)+'" y1="'+pad+'" x2="'+(bx+hojaW)+'" y2="'+(H-pad)+'" stroke="'+fc+'" stroke-width="'+sw+'"/>';
      }
    }
  }
  else if (tipo_id === 'pano-fijo') {
    interior = ''
      + '<rect x="'+(pad+2)+'" y="'+(pad+2)+'" width="'+(iW-4)+'" height="'+(iH-4)+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5"/>'
      // Cruces decorativas (reflexión de luz)
      + '<line x1="'+(pad+6)+'" y1="'+(pad+6)+'" x2="'+(W-pad-6)+'" y2="'+(H-pad-6)+'" stroke="'+gc+'" stroke-width="1" opacity="0.3"/>'
      + '<line x1="'+(W-pad-6)+'" y1="'+(pad+6)+'" x2="'+(pad+6)+'" y2="'+(H-pad-6)+'" stroke="'+gc+'" stroke-width="1" opacity="0.3"/>';
  }
  else if (tipo_id === 'ventana-abrir') {
    const N_hojas = Number(params?.hojas) || 1;
    const hojaW = Math.round((iW - (N_hojas - 1) * sw) / N_hojas);
    interior = '';
    for (let hi = 0; hi < N_hojas; hi++) {
      const bx = pad + 2 + hi * (hojaW + sw);
      const by = pad + 2, bh = iH - 4;
      const r = Math.min(hojaW, bh) * 0.8;
      // vidrio de la hoja
      interior += '<rect x="'+bx+'" y="'+by+'" width="'+hojaW+'" height="'+bh+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5"/>';
      // arco de apertura (alterna lado)
      if (hi % 2 === 0) {
        interior += '<path d="M '+bx+' '+(by+bh)+' A '+r+' '+r+' 0 0 1 '+(bx+r)+' '+by+'" fill="none" stroke="'+gc+'" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>';
        interior += '<circle cx="'+(bx+hojaW-6)+'" cy="'+(by+bh/2)+'" r="3" fill="'+gc+'"/>';
      } else {
        interior += '<path d="M '+(bx+hojaW)+' '+(by+bh)+' A '+r+' '+r+' 0 0 0 '+(bx+hojaW-r)+' '+by+'" fill="none" stroke="'+gc+'" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>';
        interior += '<circle cx="'+(bx+6)+'" cy="'+(by+bh/2)+'" r="3" fill="'+gc+'"/>';
      }
      // perfil divisor entre hojas
      if (hi < N_hojas - 1) {
        const divX = bx + hojaW + Math.round(sw/2);
        interior += '<line x1="'+divX+'" y1="'+pad+'" x2="'+divX+'" y2="'+(H-pad)+'" stroke="'+fc+'" stroke-width="'+sw+'"/>';
      }
    }
  }
  else if (tipo_id === 'banderola') {
    const bx = pad+2, by = pad+2, bw = iW-4, bh = iH-4;
    interior = ''
      // hoja completa (vidrio)
      + '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5"/>'
      // bisagras abajo (dos puntos)
      + '<circle cx="'+(bx+bw*0.25)+'" cy="'+(by+bh)+'" r="2.2" fill="'+fc+'"/>'
      + '<circle cx="'+(bx+bw*0.75)+'" cy="'+(by+bh)+'" r="2.2" fill="'+fc+'"/>'
      // arco de apertura: vertice arriba al centro (destrabe), abre hacia las bisagras abajo
      + '<path d="M '+bx+' '+(by+bh)+' L '+cx+' '+by+' L '+(bx+bw)+' '+(by+bh)+'" fill="none" stroke="'+gc+'" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>'
      // manija arriba al medio
      + '<rect x="'+(cx-5)+'" y="'+(by-1)+'" width="10" height="3" rx="1" fill="'+fc+'"/>';
  }
  else {
    interior = '<rect x="'+(pad+2)+'" y="'+(pad+2)+'" width="'+(iW-4)+'" height="'+(iH-4)+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5"/>';
  }

  // Tablillas overlay — dibuja zona tablillas respetando división por hojas
  let tabOverlay = '';
  const _pctTab = Number(params?.pct_tablillas) || 0;
  if (_pctTab > 0) {
    const _tabPos = params?.tab_pos || 'abajo';
    const _tabH = Math.round(iH * _pctTab / 100);
    const _vidH = iH - _tabH;
    const _tabY = _tabPos === 'arriba' ? pad + 2 : pad + 2 + _vidH;
    const _vidY = _tabPos === 'arriba' ? pad + 2 + _tabH : pad + 2;
    const _altoTabPerfil = Math.max(4, Math.round(_tabH / Math.max(1, Math.floor(_tabH / 12))));
    const N_tab = Number(params?.hojas) || 1;
    const hojaW = Math.round(iW / N_tab);

    for (let hi = 0; hi < N_tab; hi++) {
      const _hx = pad + 2 + hi * hojaW;
      const _hw = hojaW - 2;
      // Zona vidrio por hoja
      tabOverlay += '<rect x="'+_hx+'" y="'+_vidY+'" width="'+_hw+'" height="'+_vidH+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5" opacity="0.9"/>';
      // Zona tablillas por hoja — fondo gris
      tabOverlay += '<rect x="'+_hx+'" y="'+_tabY+'" width="'+_hw+'" height="'+_tabH+'" fill="#cbd5e1" stroke="'+fc+'" stroke-width="1"/>';
      // Líneas de tablillas por hoja
      let _ty = _tabY + _altoTabPerfil;
      while (_ty < _tabY + _tabH - 2) {
        tabOverlay += '<line x1="'+_hx+'" y1="'+_ty+'" x2="'+(_hx+_hw)+'" y2="'+_ty+'" stroke="'+fc+'" stroke-width="0.8" opacity="0.6"/>';
        _ty += _altoTabPerfil;
      }
      // Manija por hoja
      if (hi % 2 === 0) {
        tabOverlay += '<circle cx="'+(_hx+_hw-6)+'" cy="'+(pad+2+_vidH/2)+'" r="3" fill="'+gc+'"/>';
      } else {
        tabOverlay += '<circle cx="'+(_hx+6)+'" cy="'+(pad+2+_vidH/2)+'" r="3" fill="'+gc+'"/>';
      }
      // Divisor entre hojas
      if (hi < N_tab - 1) {
        tabOverlay += '<line x1="'+(_hx+_hw)+'" y1="'+pad+'" x2="'+(_hx+_hw)+'" y2="'+(H-pad)+'" stroke="'+fc+'" stroke-width="'+sw+'"/>';
      }
    }
    // Reset interior — lo redibujamos por hoja arriba
    interior = '';
  }

  return '<svg width="'+W+'" height="'+totalH+'" viewBox="0 0 '+W+' '+totalH+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">'
    // Marco exterior
    + '<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="2" fill="#f8fafc" stroke="'+fc+'" stroke-width="'+sw+'"/>'
    + (_pctTab > 0 ? '' : interior)
    + tabOverlay
    + (_pctTab === 0 ? '' : interior)
    // Etiqueta de medidas
    + '<text x="'+cx+'" y="'+(totalH-2)+'" text-anchor="middle" font-size="9" fill="'+fc+'" font-family="monospace" font-weight="600">'+label+'</text>'
    + '</svg>';
}

// SVG para módulo compuesto — dibuja secciones lado a lado
function svgModulo(secsRaw, altoMm, maxW, maxH) {
  let secciones = secsRaw;
  if (!Array.isArray(secciones)) secciones = tryParse(secciones, []);
  if (!Array.isArray(secciones)) secciones = [];
  maxW = maxW || 280; maxH = maxH || 180;
  if (!secciones.length) return '';
  const anchoTotal = secciones.reduce((s, sec) => s + Number(sec.ancho), 0);
  const ratio = anchoTotal / altoMm;
  let W, H;
  if (ratio >= 1) { W = maxW; H = Math.round(maxW / ratio); if (H > maxH) { H = maxH; W = Math.round(maxH * ratio); } }
  else { H = maxH; W = Math.round(maxH * ratio); if (W > maxW) { W = maxW; H = Math.round(maxW / ratio); } }
  W = Math.max(W, 60); H = Math.max(H, 40);
  const iW = W - 10;
  const totalH = H + 18;
  const fc = '#1e3a5f';
  const sw = Math.max(2, Math.round(Math.min(W,H)/30));

  // Dibujar cada sección usando svgAbertura() escalado
  let interior = '';
  let x = 0;
  for (const sec of secciones) {
    const secW = Math.round((Number(sec.ancho) / anchoTotal) * iW);
    const params = tryParse(sec.params, {}) || {};
    // Generar SVG de la sección individual
    const secSvg = svgAbertura(sec.tipologia_id, Number(sec.ancho), altoMm, secW, H, params);
    // Extraer el contenido interno del SVG generado (entre las etiquetas <svg>)
    const svgContent = secSvg.replace(/<svg[^>]*>/, '').replace(/<\/svg>/, '');
    // Envolver en un grupo con translate para posicionar
    interior += '<g transform="translate('+x+',0)">'+svgContent+'</g>';
    x += secW;
  }

  const labelTotal = anchoTotal + 'x' + altoMm + 'mm';
  return '<svg width="'+W+'" height="'+totalH+'" viewBox="0 0 '+W+' '+totalH+'" xmlns="http://www.w3.org/2000/svg">'
    + interior
    + '<text x="'+(W/2)+'" y="'+(totalH-2)+'" text-anchor="middle" font-size="8" fill="'+fc+'" font-family="monospace" font-weight="600">'+labelTotal+'</text>'
    + '</svg>';
}

// SVG para módulo vertical — secciones apiladas de arriba a abajo
function svgModuloV(secciones, anchomm, maxW, maxH) {
  if (!secciones || !secciones.length) return '';
  maxW = maxW||120; maxH = maxH||200;
  const altoTotal = secciones.reduce((s,sec)=>s+Number(sec.alto||0),0);
  const ratio = anchomm / altoTotal;
  let W, H;
  if (ratio >= 1) { W=maxW; H=Math.round(maxW/ratio); if(H>maxH){H=maxH;W=Math.round(maxH*ratio);} }
  else { H=maxH; W=Math.round(maxH*ratio); if(W>maxW){W=maxW;H=Math.round(maxW/ratio);} }
  W=Math.max(W,40); H=Math.max(H,40);
  const pad=5, fc='#1e3a5f', gc='#0ea5e9', gf='#dbeafe';
  const sw=Math.max(2,Math.round(Math.min(W,H)/30));
  const iH=H-pad*2, totalH=H+18;
  let interior=''; let y=pad;
  for (const sec of secciones) {
    const secH=Math.round((Number(sec.alto||0)/altoTotal)*iH);
    interior+='<rect x="'+pad+'" y="'+y+'" width="'+(W-pad*2)+'" height="'+secH+'" fill="'+gf+'" stroke="'+gc+'" stroke-width="1.5"/>';
    const label=(sec.nombre||'').substring(0,10);
    interior+='<text x="'+(W/2)+'" y="'+(y+secH/2+4)+'" text-anchor="middle" font-size="7" fill="'+fc+'" font-family="monospace">'+label+'</text>';
    y+=secH;
    if(y<H-pad) interior+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="'+fc+'" stroke-width="'+sw+'"/>';
  }
  return '<svg width="'+W+'" height="'+totalH+'" viewBox="0 0 '+W+' '+totalH+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">'
    +'<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="2" fill="#f8fafc" stroke="'+fc+'" stroke-width="'+sw+'"/>'
    +interior
    +'<text x="'+(W/2)+'" y="'+(totalH-2)+'" text-anchor="middle" font-size="8" fill="'+fc+'" font-family="monospace" font-weight="600">'+anchomm+'x'+altoTotal+'mm</text>'
    +'</svg>';
}

// Convierte SVG a PNG data URI via Canvas (para Word)
function svgToPngDataUri(tipo_id, anchoMm, altoMm, params) {
  return new Promise((resolve) => {
    const svg = svgAbertura(tipo_id, anchoMm, altoMm, 120, 160, params);
    const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width || 120;
      canvas.height = img.height || 175;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(''); };
    img.src = url;
  });
}

  // ── 1. Consolidated bin packing for profiles ─────────────────────────────

    const cortesRaw = a.es_modulo
      ? calcularModulo(a, state.perfiles, state.herrajes)
      : getCortesRaw(a.linea_id, a.tipo_id, Number(a.ancho), Number(a.alto), params, state.perfiles);
    const perfilesFiltrados = state.perfiles.filter(pf => pf.linea_id === a.linea_id);
    const agrupados = {};
    for (const c of cortesRaw) {
      if (!c.perfil) continue;
      const k = c.perfil.codigo || c.perfil.id;
      if (!agrupados[k]) agrupados[k] = [];
      agrupados[k].push({ largo: c.largo, cantidad: c.cantidad * cant, desc: c.desc || '' });
    }
    const { barrasFinales } = optimizarCortesConSobrantes(agrupados, perfilesFiltrados, precioKg, barrasAcum);
    Object.assign(barrasAcum, barrasFinales);
  }

  // ── 2. Collect all glass pieces ──────────────────────────────────────────
  const vidriosSimples = []; // { ancho, alto, desc, abertura }
  const vidrosDVH = [];      // { ancho, alto, cantidad, desc, abertura }
  for (const a of abs) {
    const cant = Number(a.cantidad) || 1;
    const params = tryParse(a.params, {});
    const tv = params.tipo_vidrio || 'vcomon';
    const vids = tryParse(a.vidrios, []) || [];
    for (const v of vids) {
      const entry = { ancho: v.ancho, alto: v.alto, desc: v.desc || '', abertura: a.nombre, cantidad: (v.cant || 1) * cant };
      if (tv === 'dvh') vidrosDVH.push(entry);
      else vidriosSimples.push(entry);
    }
    // Módulos: calcular vidrios de cada sección via calcularVidriosModulo
    if (!vids.length && a.es_modulo) {
      const vidsModulo = calcularVidriosModulo(a);
      for (const vm of vidsModulo) {
        const isDvh = /dvh/i.test(vm.desc || '');
        const entry = { ancho: vm.ancho, alto: vm.alto, desc: vm.desc, abertura: a.nombre, cantidad: (vm.cant || 1) };
        if (isDvh) vidrosDVH.push(entry); else vidriosSimples.push(entry);
      }
    }
    // If no saved vidrios, calculate on the fly (abertura simple)
    if (!vids.length && !a.es_modulo) {
      const cfg = getConfigTipo(a.linea_id, a.tipo_id);
      if (cfg?.vidrio) {
        const v = cfg.vidrio;
        const N = Number(params.hojas) || 1;
        const pctTab = Number(params.pct_tablillas) || 0;
        const Heff = pctTab > 0 ? Math.round(Number(a.alto) * (1 - pctTab/100)) : Number(a.alto);
        const fA = tv==='dvh' ? (v.formula_ancho_dvh||v.formula_ancho||'') : (v.formula_ancho_vcomon||v.formula_ancho||'');
        const fH = tv==='dvh' ? (v.formula_alto_dvh||v.formula_alto||'') : (v.formula_alto_vcomon||v.formula_alto||'');
        if (fA && fH) {
          const vA = evalFormula(fA, Number(a.ancho), Heff, N);
          const vH = evalFormula(fH, Number(a.ancho), Heff, N);
          if (vA > 0 && vH > 0) {
            const entry = { ancho: vA, alto: vH, desc: 'Vidrio', abertura: a.nombre, cantidad: N * cant };
            if (tv === 'dvh') vidrosDVH.push(entry); else vidriosSimples.push(entry);
          }
        }
      }
    }
  }

  // ── 3. Glass bin packing (guillotine strips) ─────────────────────────────
  const PLACA_W = 1800, PLACA_H = 2500;
  function packGlass(pieces) {
    const expanded = [];
    for (const pc of pieces) {
      for (let i = 0; i < (pc.cantidad || 1); i++) {
        expanded.push({ ancho: pc.ancho, alto: pc.alto, desc: pc.desc, abertura: pc.abertura });
      }
    }
    // Sort largest first
    expanded.sort((a, b) => (b.ancho * b.alto) - (a.ancho * a.alto));

    // Oversized pieces (larger than placa) go in their own entry, scaled to fit display
    const oversized = [];
    const normal = [];
    for (const piece of expanded) {
      let pw = piece.ancho, ph = piece.alto;
      // Try rotation
      if ((pw > PLACA_W || ph > PLACA_H) && ph <= PLACA_W && pw <= PLACA_H) [pw, ph] = [ph, pw];
      if (pw > PLACA_W || ph > PLACA_H) {
        oversized.push({ ...piece, ancho: pw, alto: ph, x: 0, y: 0, oversized: true });
      } else {
        normal.push({ ...piece, ancho: pw, alto: ph });
      }
    }

    const placas = [];

    // Pack normal pieces using shelf algorithm with best-fit
    for (const piece of normal) {
      let pw = piece.ancho, ph = piece.alto;

      let bestPlaca = null, bestShelf = null, bestWaste = Infinity, bestW = pw, bestH = ph;
      for (const [ow, oh] of [[pw,ph], (pw!==ph && ph<=PLACA_W && pw<=PLACA_H)?[ph,pw]:null].filter(Boolean)) {
        for (const placa of placas) {
          for (const shelf of placa.shelves) {
            const remaining = PLACA_W - shelf.usedW;
            if (remaining >= ow && shelf.y + oh <= PLACA_H) {
              // Also check: can we fit vertically (new shelf below)?
              const shelfBottom = shelf.y + Math.max(shelf.maxH, oh);
              if (shelfBottom <= PLACA_H) {
                const waste = remaining - ow;
                if (waste < bestWaste) {
                  bestWaste = waste; bestShelf = shelf; bestPlaca = placa;
                  bestW = ow; bestH = oh;
                }
              }
            }
          }
        }
      }

      if (bestPlaca && bestShelf) {
        pw = bestW; ph = bestH;
        bestPlaca.piezas.push({ ...piece, ancho: pw, alto: ph, x: bestShelf.usedW, y: bestShelf.y });
        bestShelf.usedW += pw;
        bestShelf.maxH = Math.max(bestShelf.maxH, ph);
        const newY = bestShelf.y + bestShelf.maxH;
        if (newY < PLACA_H && !bestPlaca.shelves.find(s => s.y === newY)) {
          bestPlaca.shelves.push({ y: newY, usedW: 0, maxH: 0 });
          bestPlaca.shelves.sort((a, b) => a.y - b.y);
        }
        bestPlaca.usedArea += pw * ph;
      } else {
        const placa = { piezas: [], shelves: [{ y: 0, usedW: 0, maxH: 0 }], usedArea: 0 };
        placa.piezas.push({ ...piece, ancho: pw, alto: ph, x: 0, y: 0 });
        placa.shelves[0].usedW = pw;
        placa.shelves[0].maxH = ph;
        if (ph < PLACA_H) placa.shelves.push({ y: ph, usedW: 0, maxH: 0 });
        placa.usedArea = pw * ph;
        placas.push(placa);
      }
    }

    // Add oversized as separate entries
    for (const piece of oversized) {
      placas.push({ piezas: [piece], shelves: [], usedArea: piece.ancho * piece.alto, oversized: true });
    }

    return placas;
  }

  const placasSimples = packGlass(vidriosSimples);

  // ── 4. SVG for each placa ────────────────────────────────────────────────
  const COLORS = ['#bfdbfe','#bbf7d0','#fef08a','#fecaca','#e9d5ff','#fed7aa','#cffafe','#d1fae5'];
   function svgPlaca(placa, idx) {
     const scaleW = 280, scaleH = Math.round(scaleW * PLACA_H / PLACA_W);
     // For oversized pieces: scale to fit the piece dimensions
     const maxPW = Math.max(...placa.piezas.map(p => p.x + p.ancho));
     const maxPH = Math.max(...placa.piezas.map(p => p.y + p.alto));
     const refW = placa.oversized ? maxPW : PLACA_W;
     const refH = placa.oversized ? maxPH : PLACA_H;
     const sx = v => Math.round(v * scaleW / refW);
     const sy = v => Math.round(v * scaleH / refH);
     const _realArea = placa.piezas.reduce((s, pc) => s + pc.ancho * pc.alto, 0);
     const pct = placa.oversized ? 100 : Math.min(100, Math.round(_realArea / (PLACA_W * PLACA_H) * 100));
    let rects = placa.piezas.map((pc, i) => {
      const col = COLORS[i % COLORS.length];
      const x = sx(pc.x), y = sy(pc.y), w = Math.max(2, sx(pc.ancho)), h = Math.max(2, sy(pc.alto));
      const cx2 = x + w/2, cy2 = y + h/2;
      const label = pc.ancho + 'x' + pc.alto;
      const fs = Math.min(12, Math.max(8, Math.floor(Math.min(w,h) / 10)));
      const showLabel = w >= 24 && h >= 14;
      // Center of piece, clamped inside
      const tx = Math.round(Math.min(Math.max(cx2, x + fs*label.length*0.32 + 2), x + w - fs*label.length*0.32 - 2));
      const ty = Math.round(Math.min(Math.max(cy2 + fs*0.4, y + fs + 2), y + h - 3));
      const bgW = Math.round(label.length * fs * 0.63 + 6);
      const bgH = fs + 5;
      return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+col+'" stroke="#0369a1" stroke-width="1" rx="2"/>'        + (showLabel
          ? '<rect x="'+(tx-bgW/2)+'" y="'+(ty-fs)+'" width="'+bgW+'" height="'+bgH+'" fill="white" opacity="0.85" rx="2"/>'            + '<text x="'+tx+'" y="'+ty+'" text-anchor="middle" dominant-baseline="auto" font-size="'+fs+'" fill="#0f172a" font-family="monospace" font-weight="700">'+label+'</text>'
          : '');
    }).join('');
    return '<div style="display:inline-block;margin:8px;vertical-align:top;">'      + '<div style="font-size:9pt;color:#64748b;margin-bottom:4px;text-align:center;">'+(placa.oversized?'⚠ Fuera de placa':'Placa '+(idx+1))+' &nbsp;·&nbsp; <b style="color:'+(placa.oversized?'#ef4444':pct>90?'#ef4444':pct>70?'#f59e0b':'#16a34a')+'">'+(placa.oversized?placa.piezas[0].ancho+'×'+placa.piezas[0].alto+'mm':pct+'% usado')+'</b></div>'      + '<svg width="'+scaleW+'" height="'+scaleH+'" viewBox="0 0 '+scaleW+' '+scaleH+'" style="border:1.5px solid #94a3b8;border-radius:4px;background:#f0f9ff;overflow:visible;">'      + rects      + '</svg>'      + '</div>';
  }

  const placasHtml = placasSimples.length
    ? '<div style="margin-bottom:6px;font-size:10.5pt;"><b>'+placasSimples.length+' placa'+(placasSimples.length!==1?'s':'')+' 1800×2500mm</b></div>'      + '<div style="display:flex;flex-wrap:wrap;">'+placasSimples.map((pl,i) => svgPlaca(pl,i)).join('')+'</div>'
    : '<p style="color:#64748b">Sin vidrios simples.</p>';

  const dvhHtml = vidrosDVH.length
    ? '<table style="width:100%;border-collapse:collapse;font-size:9.5pt;margin-top:8px;">'      + '<thead><tr style="background:#e2e8f0;"><th style="padding:5px 8px;border:1px solid #e2e8f0;text-align:left;">Abertura</th><th style="padding:5px 8px;border:1px solid #e2e8f0;">Medida</th><th style="padding:5px 8px;border:1px solid #e2e8f0;">Cant.</th><th style="padding:5px 8px;border:1px solid #e2e8f0;">Descripción</th></tr></thead>'      + '<tbody>'+vidrosDVH.map(v => '<tr><td style="padding:5px 8px;border:1px solid #e2e8f0;">'+v.abertura+'</td><td style="padding:5px 8px;border:1px solid #e2e8f0;text-align:center;font-family:monospace;">'+v.ancho+'×'+v.alto+'mm</td><td style="padding:5px 8px;border:1px solid #e2e8f0;text-align:center;">'+v.cantidad+'</td><td style="padding:5px 8px;border:1px solid #e2e8f0;">'+v.desc+'</td></tr>').join('')+'</tbody>'      + '</table>'
    : '';

  // ── 5. Profile cuts HTML ─────────────────────────────────────────────────
  const perfilesHtml = Object.entries(barrasAcum).map(([k, barras]) => {
    const perfil = state.perfiles.find(pf => pf.codigo === k || pf.id === k);
    const nombre = perfil ? '[' + k + '] ' + perfil.nombre : k;
    const largoBarra = Number(perfil?.largo_barra || 6000);
    const barrasHtml2 = barras.map((b, bi) => {
      const mmUsados = largoBarra - (b.resto || 0);
      const pct = Math.round((mmUsados / largoBarra) * 100);
      const color = pct >= 90 ? '#00b37e' : pct >= 70 ? '#f59e0b' : '#ef4444';
      const piezas = (b.piezas || []).map(pi =>
        '<span style="display:inline-block;background:#e0f2fe;border-radius:3px;padding:1px 5px;font-size:8pt;margin:1px;font-family:monospace;color:#0369a1;">'+pi.largo+'mm</span>'
      ).join('');
      return '<div style="margin-bottom:5px;padding:6px 8px;background:#f8fafc;border-radius:4px;border-left:3px solid '+color+';">'        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">'        +   '<span style="font-size:8.5pt;font-weight:700;color:#374151;">Barra '+(bi+1)+'</span>'        +   '<span style="font-size:7.5pt;color:#64748b;">'+mmUsados+'/'+largoBarra+'mm · resto: '+(b.resto||0)+'mm · <b style="color:'+color+'">'+pct+'%</b></span>'        + '</div>'        + '<div>'+piezas+'</div>'        + '</div>';
    }).join('');
    return '<div style="margin-bottom:10px;' + (barras.length<=4?'page-break-inside:avoid;':'') + '">'      + '<div style="font-size:10pt;font-weight:700;color:#0f172a;border-bottom:1.5px solid #e2e8f0;padding-bottom:3px;margin-bottom:4px;display:flex;justify-content:space-between;">'      +   '<span>'+nombre+'</span>'      +   '<span style="font-size:8.5pt;font-weight:400;color:#64748b;">'+barras.length+' barra'+(barras.length!==1?'s':'')+'</span>'      + '</div>'      + barrasHtml2      + '</div>';
  }).join('');

  // ── 6. Aggregate herrajes across all aberturas ──────────────────────────
  const herrajesAgrupados = {}; // nombre -> { nombre, cantidad, unidad }
  for (const a of abs) {
    const cant = Number(a.cantidad) || 1;
    if (a.es_modulo) {
      const detalleMod = getHerrajesDetalleModulo(a, state.herrajes);
      for (const h of detalleMod) {
        const key = h.nombre;
        if (!herrajesAgrupados[key]) {
          herrajesAgrupados[key] = { nombre: h.nombre, cantidad: 0, unidad: h.unidad || 'u.' };
        }
        herrajesAgrupados[key].cantidad += Number(h.cantidad); // cant ya incluido en getHerrajesDetalleModulo
      }
      continue;
    }
    const herrajesSnap = tryParse(a.herrajes_snap, []) || [];
    for (const h of herrajesSnap) {
      const key = h.nombre;
      if (!herrajesAgrupados[key]) {
        herrajesAgrupados[key] = { nombre: h.nombre, cantidad: 0, unidad: h.unidad || 'u.' };
      }
      herrajesAgrupados[key].cantidad += Number(h.cantidad) * cant;
    }
  }
  const herrajesResumenRows = Object.values(herrajesAgrupados)
    .sort((a, b) => a.nombre.localeCompare(b.nombre))
    .map(h =>
      '<tr>'
      + '<td style="padding:7px 10px;border:1px solid #e2e8f0;font-weight:600;">' + h.nombre + '</td>'
      + '<td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:center;font-family:monospace;font-size:11pt;">' + (Number.isInteger(h.cantidad) ? h.cantidad : Math.round(h.cantidad * 100)/100) + '</td>'
      + '<td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:center;color:#64748b;">' + h.unidad + '</td>'
      + '</tr>'
    ).join('');
  const herrajesResumenHtml = Object.keys(herrajesAgrupados).length
    ? '<table style="width:100%;border-collapse:collapse;font-size:10.5pt;">'
      + '<thead><tr style="background:#0f172a;color:#fff;">'
      +   '<th style="padding:8px 10px;text-align:left;">Herraje / Accesorio</th>'
      +   '<th style="padding:8px 10px;text-align:center;">Cantidad total</th>'
      +   '<th style="padding:8px 10px;text-align:center;">Unidad</th>'
      + '</tr></thead>'
      + '<tbody>' + herrajesResumenRows + '</tbody>'
      + '</table>'
    : '<p style="color:#64748b;">Sin herrajes registrados.</p>';

  // ── 7. Detail per abertura (cuts + herrajes) ──────────────────────────────
  const fmtFecha = f => {
    if (!f) return '-';
    if (typeof f === 'string' && f.includes('GMT')) {
      const d = new Date(f);
      return !isNaN(d) ? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear() : f;
    }
    return f;
  };

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Plan de cortes — ${p.cliente}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #1a1a1a; padding: 20px; max-width: 960px; margin: 0 auto; }
    h1 { font-size: 18pt; color: #0f172a; margin-bottom: 4px; }
    h2 { font-size: 13pt; color: #0f172a; border-bottom: 2px solid #0f172a; padding-bottom: 6px; margin: 24px 0 14px; }
    @media print { body { padding: 10px; } h2 { page-break-before: auto; } button { display: none !important; } }
  </style>
  </head><body>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
    <div><h1>Plan de cortes</h1>
    <div style="font-size:9.5pt;color:#64748b;margin-top:4px;">${p.cliente} &nbsp;·&nbsp; ${p.obra||''} &nbsp;·&nbsp; ${fmtFecha(p.fecha)}</div></div>
    <button onclick="window.print()" style="padding:8px 18px;background:#0f172a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:11pt;font-weight:600;">🖨 Imprimir / PDF</button>
  </div>

  <h2>📐 Cortes de perfiles</h2>
  ${perfilesHtml}

  <h2>🪟 Vidrio simple — Placas 1800×2500mm</h2>
  ${placasHtml}

  ${vidrosDVH.length ? '<h2>🔷 Vidrio DVH — Por unidad</h2>' + dvhHtml : ''}

  <h2>🔩 Resumen de herrajes y accesorios</h2>
  ${herrajesResumenHtml}
  </body></html>`);
  win.document.close();
}

          else { _sharedH = _maxH; _totalW = Math.round(_maxH * _ratio); if (_totalW > _maxTotalW) { _totalW = _maxTotalW; _sharedH = Math.round(_maxTotalW / _ratio); } }
          _sharedH = Math.max(_sharedH, 40);
          return '<div style="display:flex;gap:0;align-items:flex-end;">'
            + _secsArr.map((sec, _si) => {
                const _sp = tryParse(sec.params, {}) || {};

                const _secSvg = svgAbertura(sec.tipologia_id, Number(sec.ancho), _altoMm, _secWpx, _sharedH, _sp);

				const _isLast = _si === _secsArr.length - 1;
				return '<div style="display:flex;flex-direction:column;align-items:center;">'

      +'Todas las medidas detalladas en el presupuesto se expresan en ancho x alto, salvo aclaración expresa en contrario. La toma de medidas definitiva se realizará una vez que los vanos se encuentren terminados, escuadrados y con los niveles de piso definidos. En caso de fabricar sobre medidas proporcionadas por el cliente o terceros, la responsabilidad por posibles diferencias o errores será exclusiva del solicitante, no admitiéndose reclamos posteriores por este motivo. Las modificaciones de medidas, tipologías o características luego de aprobada la fabricación podrán generar costos adicionales y modificaciones en los plazos de entrega. Las puertas y ventanas se entregan con los sistemas de cierre correspondientes a cada línea. Cerraduras con llave u otros accesorios especiales se incluirán únicamente cuando estén especificados en el presupuesto. La garantía cubre exclusivamente defectos de fabricación y no contempla daños ocasionados por golpes, uso indebido, intervenciones de terceros, asentamientos de obra o falta de mantenimiento.'

}

async function exportarWord(id) {
  const p = state.presupuestos.find(x => x.id === id);
  if (!p) return;
  toast('Generando Word...');
  const abs = state.aberturas.filter(a => a.presupuesto_id === id);
  const markup = Number(p.markup || 0);
  const subtotal = abs.reduce((s, a) => s + Number(a.costo_perfiles||0) + Number(a.costo_vidrios||0) + Number(a.costo_herrajes||0), 0);
  const totalFinal = subtotal * (1 + markup / 100);

  // Generar todos los PNG en paralelo
  const pngs = await Promise.all(abs.map(a => svgToPngDataUri(a.tipo_id, a.ancho, a.alto, tryParse(a.params, {}))));

  const filaAberturas = abs.map((a, i) => {
    const costoAb = (parseFloat(a.costo_perfiles)||0)+(parseFloat(a.costo_vidrios)||0)+(parseFloat(a.costo_herrajes)||0);
    const precioTotalAb = costoAb * (1 + markup/100);
    const cantAb = Number(a.cantidad) || 1;
    const precioUnitAb = precioTotalAb / cantAb;
    const total = precioTotalAb; // used below for the row total
    const imgTag = pngs[i] ? '<img src="'+pngs[i]+'" width="90" style="display:block;margin:0 auto;" alt="abertura">' : '';
    return '<tr>'
      +'<td style="border:1px solid #ccc;padding:8px;text-align:center;vertical-align:middle;">'+(i+1)+'</td>'
      +'<td style="border:1px solid #ccc;padding:10px;text-align:center;vertical-align:middle;">'+imgTag+'</td>'
      +'<td style="border:1px solid #ccc;padding:8px;vertical-align:middle;">'
        +'<b style="font-size:11pt;">'+a.nombre+'</b><br>'

        +'<span style="font-size:9pt;color:#555;">'+(p.color_al||'-')+'</span>'

      +'<td style="border:1px solid #ccc;padding:8px;text-align:right;vertical-align:middle;white-space:nowrap;font-weight:bold;font-size:11pt;">'+fmt(total)+'</td>'

// Config scroll spy
function _initConfigScrollSpy() {
  const sections = ['cfg-params','cfg-lineas','cfg-perfiles','cfg-herrajes','cfg-tipologias'];
  const links = document.querySelectorAll('.cfg-nav-link');
  if (!links.length) return;
  const onScroll = () => {
    let current = sections[0];
    for (const id of sections) {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= 80) current = id;
    }
    links.forEach(l => {
      const active = l.getAttribute('data-target') === current;
      l.style.background = active ? 'var(--accent)22' : 'var(--surface)';
      l.style.borderColor = active ? 'var(--accent)' : 'var(--border)';
      l.style.color = active ? 'var(--accent)' : 'var(--text2)';
    });
  };
  const container = document.querySelector('.main-content') || window;
  container.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}
