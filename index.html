      style="width:100%;padding:10px 12px 10px 36px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;"
    >
    ${state._presupuestosBusqueda ? '<button onclick="state._presupuestosBusqueda=\'\';_renderListaCards();document.getElementById(\'ps_busqueda\').value=\'\'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;">×</button>' : ''}
  </div>
  <div class="card-grid">${cards}</div>`;
}

// ============================================================
// DETALLE PRESUPUESTO
// ============================================================
function renderDetalle() {
  const p = state.presupuestos.find(x => x.id === state.presupuestoActivo);
  if (!p) return '<p>No encontrado</p>';
  const abs = state.aberturas.filter(a => a.presupuesto_id === p.id);
  const tab = state._tab || 'aberturas';

  // Calcular costos en tiempo real usando calcularCostoAberturas (respeta cantidad)
  const precioKgHeader = getPrecioKgPresupuesto(p);
  const { costos: costosHeader } = calcularCostoAberturas(abs, state.perfiles, state.herrajes, precioKgHeader, state._criterioPrecio || 'barra_completa', state.umbral_sobrante);
  const costoP = Object.values(costosHeader).reduce((s, c) => s + c.perfiles, 0);
  const costoV = Object.values(costosHeader).reduce((s, c) => s + c.vidrios, 0);
  const costoH = Object.values(costosHeader).reduce((s, c) => s + c.herrajes, 0);
  const subtotal = costoP + costoV + costoH;
  const markup = Number(p.markup || 0);
  const _cobrarSobHeader = (state._criterioPrecio === 'proporcional') && p.cobrar_sobrante;
  const totalFinal = subtotal * (1 + markup / 100) + (_cobrarSobHeader ? (p.costo_sobrante || 0) : 0);

  const estadoOpts = ESTADOS.map(e => `<option value="${e.id}" ${p.estado===e.id?'selected':''}>${e.label}</option>`).join('');

  let tabContent = '';
  if (tab === 'aberturas') {
    const pres = state.presupuestos.find(x => x.id === state.presupuestoActivo);
    const precioKg = getPrecioKgPresupuesto(pres);
    const criterio = state._criterioPrecio || 'barra_completa';
    const { costos } = calcularCostoAberturas(abs, state.perfiles, state.herrajes, precioKg, criterio, state.umbral_sobrante);

    const abCards = abs.map((a, idx) => {
      const c = costos[a.id] || { perfiles: 0, vidrios: 0, herrajes: 0, herrajesDetalle: [] };
      const cTotal = c.perfiles + c.vidrios + c.herrajes;

      // MODULO COMPUESTO — card expandible
      if (a.es_modulo) {
        return _renderModuloCard(a, c, cTotal);
      }

      // ABERTURA SIMPLE — card original      // ABERTURA SIMPLE — card original
      const herrajesEditables = _getHerrajesSnapAb(a);
      const herrajesHtml = herrajesEditables.map(function(h, hi) {
        return _renderHerrajeRow(a.id, a.linea_id, a.cantidad, h, hi);
      }).join('');
      const _abParams = tryParse(a.params,{});
      const tvBadge = _abParams.subtipo_vidrio_nombre
        ? ' · <span style="color:#0ea5e9;font-size:11px;">'+_abParams.subtipo_vidrio_nombre+'</span>'
        : _abParams.tipo_vidrio==='dvh' ? ' · <span style="color:var(--accent);font-size:11px;">DVH</span>' : '';

      return `
      <div class="ab-card" style="flex-direction:column;gap:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="flex:1">
            <div class="ab-nombre">${a.nomenclatura ? '<span style="color:var(--accent);">' + a.nomenclatura + '</span> · ' : ''}${a.nombre}</div>
            <div class="ab-meta">${a.ancho}x${a.alto} mm · ${a.cantidad} u. · ${a.linea}${tvBadge}</div>
          </div>
          <div style="text-align:right">
            <div class="ab-costo">${fmt(cTotal)}</div>
            <div style="display:flex;gap:6px;margin-top:6px;justify-content:flex-end;">
              <button class="btn-secondary" style="font-size:12px;padding:6px 10px;" onclick="showEditAbertura('${a.id}')">✏️ Editar</button>
              <button class="btn-danger" onclick="eliminarAbertura('${a.id}')">✕ Eliminar</button>
            </div>
          </div>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;gap:24px;flex-wrap:wrap;">
          <div style="flex:1;min-width:160px;">
            <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Desglose</div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:2px 0;">
              <span>Perfiles aluminio</span><span style="font-family:'DM Mono',monospace;">${fmt(c.perfiles)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:2px 0;">
              <span>Vidrios</span><span style="font-family:'DM Mono',monospace;">${fmt(c.vidrios)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:2px 0;">
              <span>Herrajes</span><span style="font-family:'DM Mono',monospace;">${fmt(c.herrajes)}</span>
            </div>
          </div>
          <div style="flex:2;min-width:200px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <span style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;">Herrajes y accesorios</span>
              <button onclick="showModalAgregarHerraje('${a.id}')" style="font-size:11px;padding:3px 10px;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text3);cursor:pointer;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text3)'">+ Agregar herraje</button>
            </div>
            ${herrajesHtml || '<div style="font-size:12px;color:var(--text3);">Sin herrajes</div>'}
          </div>
        </div>
      </div>`;
    }).join('');

    const criterioOpts = [
      { id: 'proporcional',   label: 'Precio proporcional al uso' },
      { id: 'barra_completa', label: 'Precio perfil completo' },
    ].map(o => `<option value="${o.id}" ${criterio===o.id?'selected':''}>${o.label}</option>`).join('');

    tabContent = `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;">
        <span style="font-size:13px;color:var(--text2);font-weight:600;">Criterio de precio:</span>
        <select style="flex:1;max-width:280px;" onchange="setCriterioPrecio(this.value)">${criterioOpts}</select>
      </div>
      ${abCards}
      <div id="addAbWrap"></div>
      ${['aprobado','rechazado'].includes(p.estado)
        ? '<div style="padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--text3);text-align:center;">El presupuesto esta ' + p.estado + ' — no se pueden agregar mas aberturas.</div>'
        : '<button class="btn-add-ab" onclick="showAddAbertura()">+ Abertura simple</button>'
          + '<button class="btn-add-ab" style="margin-left:8px;background:var(--surface2);border:1px solid var(--accent)44;" onclick="showAddModulo()">+ Modulo compuesto</button>'}`;
  }

  if (tab === 'calculo') {
    const pres = state.presupuestos.find(x => x.id === state.presupuestoActivo);
    const precioKg = getPrecioKgPresupuesto(pres);
    const criterio = state._criterioPrecio || pres?.criterio_precio || 'barra_completa';

    // Recalcular bin packing consolidado para detalle de barras
    let barrasAcum = {};
    for (const a of abs) {
      const cant = Number(a.cantidad) || 1;
      const params = tryParse(a.params, {});
      const cortesRaw = a.es_modulo
        ? calcularModulo(a, state.perfiles, state.herrajes)
        : getCortesRaw(a.linea_id, a.tipo_id, Number(a.ancho), Number(a.alto), params, state.perfiles);
      const perfilesFiltrados = state.perfiles.filter(pf => pf.linea_id === a.linea_id);
      const agrupados = {};
      for (const c of cortesRaw) {
        if (!c.perfil) continue;
        const key = c.perfil.codigo || c.perfil.id;
        if (!agrupados[key]) agrupados[key] = [];
        agrupados[key].push({ largo: c.largo, cantidad: c.cantidad * cant, desc: c.desc });
      }
      const { barrasFinales } = optimizarCortesConSobrantes(agrupados, perfilesFiltrados, precioKg, barrasAcum);
      barrasAcum = barrasFinales;
    }

    // Calcular costos según criterio para mostrar en consolidado
    const { costos: costosMat } = calcularCostoAberturas(abs, state.perfiles, state.herrajes, precioKg, criterio, state.umbral_sobrante);
    const costoPorPerfil = {}; // k -> costo total según criterio
    for (const a of abs) {
      const params = tryParse(a.params, {});
      const cortesRaw = a.es_modulo
        ? calcularModulo(a, state.perfiles, state.herrajes)
        : getCortesRaw(a.linea_id, a.tipo_id, Number(a.ancho), Number(a.alto), params, state.perfiles);
      for (const c of cortesRaw) {
        if (!c.perfil) continue;
        const k = c.perfil.codigo || c.perfil.id;
        if (!costoPorPerfil[k]) costoPorPerfil[k] = 0;
      }
    }
    // Distribuir costos de perfiles por perfil key
    for (const a of abs) {
      const params = tryParse(a.params, {});
      const cortesRaw = a.es_modulo
        ? calcularModulo(a, state.perfiles, state.herrajes)
        : getCortesRaw(a.linea_id, a.tipo_id, Number(a.ancho), Number(a.alto), params, state.perfiles);
      const mmEsta = {};
      for (const c of cortesRaw) {
        if (!c.perfil) continue;
        const k = c.perfil.codigo || c.perfil.id;
        mmEsta[k] = (mmEsta[k] || 0) + c.largo * c.cantidad;
      }
    }

    // Construir consolidadoFinal con costo según criterio
    const consolidadoFinal = {};
    for (const [k, barras] of Object.entries(barrasAcum)) {
      const perfil = state.perfiles.find(p => p.codigo === k || p.id === k);
      if (!perfil) continue;
      const nombre = perfil.nombre || k;
      const codigo = perfil.codigo || '';
      const largoBarra = Number(perfil.largo_barra || 6000);
      const costoPorBarra = (parseFloat(perfil.peso_tira) || 0) * (parseFloat(precioKg) || 0);
      // Costo según criterio = suma de perfilesPorCodigo de todas las aberturas para este perfil
      let costoSegunCriterio = 0;
      for (const a of abs) {
        costoSegunCriterio += costosMat[a.id]?.perfilesPorCodigo?.[k] || 0;
      }

      consolidadoFinal[k] = {
        nombre, codigo, largoBarra, costoPorBarra,
        barras: barras.length,
        costo: costoSegunCriterio,
        detalleBarras: barras.map((b, i) => ({
          barra: i + 1,
          piezas: b.piezas || [],
          resto: b.resto,
          largoBarra,
          nueva: b.nueva,
        })),
      };
    }

    const criterioOpts = [
      { id: 'proporcional',   label: 'Precio proporcional al uso' },
      { id: 'barra_completa', label: 'Precio perfil completo' },
    ].map(o => `<option value="${o.id}" ${criterio===o.id?'selected':''}>${o.label}</option>`).join('');

    const tieneConsolidado = Object.keys(consolidadoFinal).length > 0;

    const matRows = tieneConsolidado
      ? Object.entries(consolidadoFinal).map(([k, m]) => {
          const rowId = 'mr_' + k.replace(/[^a-zA-Z0-9]/g, '_');
          const barrasHtml = m.detalleBarras.map(b => {
            const piezasHtml = (b.piezas || []).map(pz =>
              '<div style="display:inline-flex;align-items:center;gap:4px;background:var(--accent)22;border:1px solid var(--accent)44;border-radius:4px;padding:3px 8px;font-size:11px;margin:2px;">'
              + '<span style="font-family:\'DM Mono\',monospace;color:var(--accent);font-weight:700;">' + pz.largo + 'mm</span>'
              + (pz.desc ? '<span style="color:var(--text3);font-size:10px;">— ' + pz.desc + '</span>' : '')
              + '</div>'
            ).join('');
            const usadoMm = m.largoBarra - (b.resto || 0);
            const pct = Math.round((usadoMm / m.largoBarra) * 100);
            const colorBarra = pct > 90 ? 'var(--accent)' : pct > 70 ? '#FFB830' : '#FF4D6A';
            const esSobrante = (b.resto || 0) / m.largoBarra * 100 > state.umbral_sobrante;
            return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:6px;">'
              + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
                + '<span style="font-size:11px;font-weight:700;color:var(--text3)">BARRA ' + b.barra + '</span>'
                + '<span style="font-size:11px;font-family:\'DM Mono\',monospace;color:'+colorBarra+'">'
                  + usadoMm + '/' + m.largoBarra + 'mm · resto: ' + (b.resto||0) + 'mm · ' + pct + '%'
                  + (esSobrante ? ' <span style="color:#00E5A0;font-size:10px;">→ stock</span>' : '')
                + '</span>'
              + '</div>'
              + '<div style="height:8px;background:var(--border);border-radius:4px;margin-bottom:8px;overflow:hidden;">'
                + '<div style="height:100%;width:'+pct+'%;background:'+colorBarra+';border-radius:4px;"></div>'
              + '</div>'
              + piezasHtml
            + '</div>';
          }).join('');

          return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;">'
            + '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleMatRow(\''+rowId+'\')">'
              + '<div style="display:flex;align-items:center;gap:10px;">'
                + (m.codigo ? '<span style="font-family:\'DM Mono\',monospace;color:var(--accent);font-size:12px;background:var(--accent)11;padding:2px 8px;border-radius:4px;">['+m.codigo+']</span>' : '')
                + '<span style="font-weight:600;color:var(--text)">' + m.nombre + '</span>'
              + '</div>'
              + '<div style="display:flex;align-items:center;gap:16px;">'
                + '<span class="mat-badge">' + m.barras + ' barra' + (m.barras!==1?'s':'') + '</span>'
                + '<span style="font-family:\'DM Mono\',monospace;color:var(--accent);font-weight:700;">' + fmt(m.costo) + '</span>'
                + '<span style="color:var(--text3);font-size:12px;">▼</span>'
              + '</div>'
            + '</div>'
            + '<div id="'+rowId+'" style="display:none;">' + barrasHtml + '</div>'
          + '</div>';
        }).join('')
      : '<div style="color:var(--text3);padding:24px;text-align:center;border:1px dashed var(--border2);border-radius:8px">Sin datos. Agregá aberturas primero.</div>';

    const detalle = abs.map(a => {
      const cAb = costosMat[a.id] || {};
      const params = tryParse(a.params, {});
      const cortesRaw = a.es_modulo
        ? calcularModulo(a, state.perfiles, state.herrajes)
        : getCortesRaw(a.linea_id, a.tipo_id, Number(a.ancho), Number(a.alto), params, state.perfiles);
      const perfilesFiltrados = state.perfiles.filter(pf => pf.linea_id === a.linea_id);
      const perfilesUsados = [...new Set(cortesRaw.filter(c => c.perfil).map(c => c.perfil.codigo || c.perfil.id))];
      const filas = perfilesUsados.map(k => {
        const perfil = perfilesFiltrados.find(p => p.codigo === k || p.id === k);
        if (!perfil) return '';
        const cant = Number(a.cantidad) || 1;
        const mmAb = cortesRaw.filter(c => c.perfil && (c.perfil.codigo === k || c.perfil.id === k))
          .reduce((s, c) => s + c.largo * c.cantidad * cant, 0);
        // Usar costo desglosado por perfil directamente
        const costoEste = cAb.perfilesPorCodigo?.[k] || 0;
        return '<div class="preview-row">'
          + '<span>['+k+'] ' + perfil.nombre + '</span>'
          + '<span style="color:var(--text3)">' + mmAb + 'mm usados</span>'
          + '<span>' + fmt(costoEste) + '</span>'
          + '</div>';
      }).join('');
      const cantAb = Number(a.cantidad) || 1;
      const vidrioFilas = (tryParse(a.vidrios, []) || []).map(v =>
        '<div class="preview-row">'
        + '<span>' + v.desc + ' (' + v.ancho + 'x' + v.alto + 'mm)' + (cantAb > 1 ? ' × '+cantAb : '') + '</span>'
        + '<span style="color:var(--text3)">' + ((v.ancho/1000)*(v.alto/1000)*cantAb).toFixed(2) + ' m²</span>'
        + '<span>' + fmt((v.ancho/1000)*(v.alto/1000)*Number(a.precio_vidrio||8500)*cantAb) + '</span>'
        + '</div>'
      ).join('');
      return '<div style="margin-bottom:18px">'
        + '<div style="font-size:13px;font-weight:700;color:var(--text3);background:var(--bg);padding:8px 12px;border-radius:7px;margin-bottom:6px">'
          + a.nombre + ' — ' + a.ancho + 'x' + a.alto + 'mm x ' + a.cantidad + ' u.'
        + '</div>'
        + filas + vidrioFilas
        + '</div>';
    }).join('');

    tabContent = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;">
        <span style="font-size:13px;color:var(--text2);font-weight:600;">Criterio de precio:</span>
        <select style="flex:1;max-width:280px;" onchange="setCriterioPrecio(this.value)">${criterioOpts}</select>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 style="font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin:0;">Materiales consolidados — click para ver cortes por barra</h3>
        <button onclick="imprimirPlanCortes('${p.id}')" style="display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--text2)'">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Imprimir plan de cortes
        </button>
      </div>
      ${matRows}
      <h3 style="font-size:14px;font-weight:700;color:var(--text2);margin:24px 0 14px;text-transform:uppercase;letter-spacing:0.05em;">Detalle por abertura</h3>
      ${detalle || '<p style="color:var(--text3)">Sin aberturas</p>'}`;
  }

  if (tab === 'resumen') {
    const presR = state.presupuestos.find(x => x.id === state.presupuestoActivo);
    const precioKgR = getPrecioKgPresupuesto(presR);
    const criterioR = state._criterioPrecio || 'barra_completa';
    const { costos: costosR } = calcularCostoAberturas(abs, state.perfiles, state.herrajes, precioKgR, criterioR, state.umbral_sobrante);
    const costoPR = Object.values(costosR).reduce((s, c) => s + c.perfiles * 1, 0);
    const costoVR = Object.values(costosR).reduce((s, c) => s + c.vidrios * 1, 0);
    const costoHR = Object.values(costosR).reduce((s, c) => s + c.herrajes * 1, 0);
    const subtotalR = costoPR + costoVR + costoHR;
    const _cobrarSobR = criterioR === 'proporcional' && presR?.cobrar_sobrante;
    const totalFinalR = subtotalR * (1 + markup / 100) + (_cobrarSobR ? (presR?.costo_sobrante || 0) : 0);

    const criterioOpts2 = [
      { id: 'proporcional',   label: 'Precio proporcional al uso' },
      { id: 'barra_completa', label: 'Precio perfil completo' },
    ].map(o => `<option value="${o.id}" ${criterioR===o.id?'selected':''}>${o.label}</option>`).join('');

    tabContent = `
      <div style="max-width:520px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;">
          <span style="font-size:13px;color:var(--text2);font-weight:600;white-space:nowrap;">Criterio:</span>
          <select style="flex:1;" onchange="setCriterioPrecio(this.value)">${criterioOpts2}</select>
          ${criterioR === 'proporcional' ? `
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;margin-left:8px;">
              <input type="checkbox" ${presR?.cobrar_sobrante ? 'checked' : ''} onchange="toggleCobrarSobrante(this.checked)"
                style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;">
              Cobrar sobrante al costo
            </label>` : ''}
        </div>
        <div class="card">
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:18px">Resumen de costos</div>
          <div class="resumen-row"><span>Perfiles de aluminio</span><span style="font-family:'DM Mono',monospace">${fmt(costoPR)}</span></div>
          <div class="resumen-row"><span>Vidrios</span><span style="font-family:'DM Mono',monospace">${fmt(costoVR)}</span></div>
          <div class="resumen-row"><span>Herrajes</span><span style="font-family:'DM Mono',monospace">${fmt(costoHR)}</span></div>
          ${criterioR === 'proporcional' && presR?.cobrar_sobrante && presR?.costo_sobrante > 0 ? `
          <div class="resumen-row" style="color:var(--text2);font-style:italic;">
            <span>Sobrante al costo (sin ganancia)</span>
            <span style="font-family:'DM Mono',monospace">${fmt(presR.costo_sobrante)}</span>
          </div>` : ''}
          <div class="resumen-row" style="font-weight:700;border-top:1px solid var(--border2);margin-top:8px;padding-top:14px">

// ============================================================
// KANBAN
// ============================================================
function renderKanban() {
  const aprobados = state.presupuestos.filter(p => p.estado === 'aprobado' || p.kanban_col);
  const colIdx = Object.fromEntries(KANBAN_COLS.map((c, i) => [c.id, i]));

  const cols = KANBAN_COLS.map(col => {
    const cards = aprobados.filter(p => (p.kanban_col || 'pendiente') === col.id);
    const cardHtml = cards.map(p => {
      const colActualIdx = colIdx[col.id] ?? 0;
      // Solo mostrar "avanzar" (siguiente columna) y opcionalmente retroceder
      const colSiguiente = KANBAN_COLS[colActualIdx + 1];
      const colAnterior  = KANBAN_COLS[colActualIdx - 1];

      // Ícono especial para transiciones con lógica
      const labelSig = col.id === 'pendiente'    ? '🛒 Pasar a Compra'
                     : col.id === 'materiales'   ? '🔨 Pasar a Construcción'
                     : colSiguiente               ? '→ ' + colSiguiente.label
                     : null;

      const btnAvanzar = colSiguiente
        ? `<button onclick="moverKanban('${p.id}','${colSiguiente.id}')" style="background:${colSiguiente.color}22;color:${colSiguiente.color};border-color:${colSiguiente.color}44;font-weight:600;">${labelSig}</button>`
        : '';
      const btnRetroceder = colAnterior
        ? `<button onclick="moverKanban('${p.id}','${colAnterior.id}')" style="font-size:10px;opacity:0.6;">← ${colAnterior.label}</button>`
        : '';

      // Indicador de stock para columna materiales
      let stockIndicador = '';
      if (col.id === 'materiales') {
        const analisis = calcularNecesidadesMateriales(p);
        const conStock = analisis.filter(a => a.stockUsado.length > 0).length;
        const barrasComprar = analisis.reduce((s, a) => s + a.barrasNuevas.length, 0);
        stockIndicador = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;">
          ${conStock > 0 ? `<span style="font-size:10px;padding:2px 8px;background:var(--accent)22;color:var(--accent);border-radius:10px;font-weight:700;">${conStock} del stock</span>` : ''}
          ${barrasComprar > 0 ? `<span style="font-size:10px;padding:2px 8px;background:#FFB83022;color:#FFB830;border-radius:10px;font-weight:700;">${barrasComprar} a comprar</span>` : ''}
          ${barrasComprar === 0 ? `<span style="font-size:10px;padding:2px 8px;background:var(--accent)22;color:var(--accent);border-radius:10px;font-weight:700;">✓ sin compras</span>` : ''}
        </div>`;
      }

      return `
      <div class="kanban-card">
        <div class="kanban-card-cliente">${p.cliente}</div>
        <div class="kanban-card-obra">${p.obra}</div>
        <div class="kanban-card-total">${fmt(p.total_final)}</div>
        ${stockIndicador}
        <div class="kanban-move">
          ${btnAvanzar}
          ${btnRetroceder}
        </div>
      </div>`;
    }).join('') || `<div style="padding:20px 0;text-align:center;color:var(--text3);font-size:12px;">Sin obras</div>`;

    return `
    <div class="kanban-col">
      <div class="kanban-col-title" style="color:${col.color}">
        ${col.label} <span class="kanban-count">${cards.length}</span>
      </div>
      ${cardHtml}
    </div>`;
  }).join('');

  return `
  <div class="page-header">
    <div>
      <div class="page-title">Kanban de Obras</div>
      <div class="page-sub">Presupuestos aprobados en seguimiento</div>
    </div>
  </div>
  <div class="kanban-board">${cols}</div>`;
}

function toggleMatRow(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function setConfigLinea(linea_id) {
  state._configLinea = linea_id;
  const tipos = getTiposLinea(linea_id);
  state._configTipo = tipos[0]?.id || '';
  render();
}

function setConfigTipo(tipo_id) {
  state._configTipo = tipo_id;
  render();
}

function _ensureConfigTipo(linea_id, tipo_id) {
  if (!state.config_tipologias[linea_id]) state.config_tipologias[linea_id] = {};
  if (!state.config_tipologias[linea_id][tipo_id]) {
    const def = CONFIG_TIPOLOGIAS_DEFAULT[linea_id]?.[tipo_id];
    state.config_tipologias[linea_id][tipo_id] = def
      ? { perfiles: def.perfiles.map(p => ({...p})), vidrio: {...def.vidrio} }
      : { perfiles: [], vidrio: { formula_ancho: '', formula_alto: '' } };
  }
  return state.config_tipologias[linea_id][tipo_id];
}

// Guarda config de una tipología en la pestaña Config del Sheet
async function saveConfigTipo(linea_id, tipo_id) {
  const cfg = state.config_tipologias?.[linea_id]?.[tipo_id];
  if (!cfg) return;
  const key = 'tipologia_' + linea_id + '__' + tipo_id;
  const value = JSON.stringify(cfg);
  // Buscar si ya existe una fila con esta key
  const existing = await sheetsGet(SHEETS.config);
  const row = existing.find(r => r.key === key);
  if (row) {
    await sheetsUpdateRow(SHEETS.config, row.id, { key, value });
  } else {
    await sheetsAppend(SHEETS.config, { id: genId(), key, value });
  }
}

function updateConfigPerfil(linea_id, tipo_id, idx, campo, valor) {
  const cfg = _ensureConfigTipo(linea_id, tipo_id);
  if (cfg.perfiles[idx]) cfg.perfiles[idx][campo] = valor;
  saveConfigTipo(linea_id, tipo_id);
  toast('Guardado');
}

function updateConfigGif(linea_id, tipo_id, url) {
  const cfg = _ensureConfigTipo(linea_id, tipo_id);
  cfg.gif_url = url.trim();
  saveConfigTipo(linea_id, tipo_id);
  toast('GIF guardado');
  render();
}

function updateConfigVidrio(linea_id, tipo_id, campo, valor) {
  const cfg = _ensureConfigTipo(linea_id, tipo_id);
  cfg.vidrio[campo] = valor;
  saveConfigTipo(linea_id, tipo_id);
  toast('Guardado');
}


function _saveTiposVidrio() {
  const val = JSON.stringify(state.tipos_vidrio);
  // Buscar directo en el Sheet para no depender de _rawConfig desactualizado
  sheetsGet(SHEETS.config).then(rows => {
    const matches = rows.filter(r => r.key === 'tipos_vidrio');
    if (matches.length === 0) {
      // No existe — crear
      const row = { id: genId(), key: 'tipos_vidrio', value: val };
      sheetsAppend(SHEETS.config, row).catch(() => {});
      if (!state._rawConfig) state._rawConfig = [];
      state._rawConfig.push(row);
    } else {
      // Actualizar la primera y eliminar las duplicadas
      sheetsUpdateRow(SHEETS.config, matches[0].id, { value: val }).catch(() => {});
      for (let i = 1; i < matches.length; i++) {
        sheetsDeleteRow(SHEETS.config, matches[i].id).catch(() => {});
      }
      // Sincronizar _rawConfig
      if (state._rawConfig) {
        const idx = state._rawConfig.findIndex(r => r.key === 'tipos_vidrio');
        if (idx >= 0) state._rawConfig[idx].value = val;
      }
    }
  }).catch(() => {});
}

function agregarTipoVidrio() {
  if (!state.tipos_vidrio) state.tipos_vidrio = [];
  state.tipos_vidrio.push({ id: genId(), nombre: 'Nuevo tipo', tipo_base: 'vcomon', precio: 8500 });
  _saveTiposVidrio();
  render();
}

function editarTipoVidrio(id, campo, valor) {
  const tv = state.tipos_vidrio?.find(t => t.id === id);
  if (!tv) return;
  tv[campo] = valor;
  _saveTiposVidrio();
  toast('Guardado');
}

function eliminarTipoVidrio(id) {
  state.tipos_vidrio = (state.tipos_vidrio || []).filter(t => t.id !== id);
  _saveTiposVidrio();
  render();
}

function updateConfigPremarco(linea_id, campo, valor) {
  if (!state.config_tipologias.__premarco__) state.config_tipologias.__premarco__ = {};
  if (!state.config_tipologias.__premarco__[linea_id]) state.config_tipologias.__premarco__[linea_id] = {};
  state.config_tipologias.__premarco__[linea_id][campo] = valor;
  // Save to sheet
  const key = 'premarco_' + linea_id;
  const val = JSON.stringify(state.config_tipologias.__premarco__[linea_id]);
  const existing = state._rawConfig?.find(r => r.key === key);
  if (existing) {
    sheetsUpdateRow(SHEETS.config, existing.id, { value: val }).catch(() => {});
    existing.value = val;
  } else {
    const row = { id: genId(), key, value: val };
    sheetsAppend(SHEETS.config, row).catch(() => {});
    if (!state._rawConfig) state._rawConfig = [];
    state._rawConfig.push(row);
  }
  toast('Guardado');
  render();
}

function getConfigPremarco(linea_id) {
  return state.config_tipologias?.__premarco__?.[linea_id] || {};
}

function updateConfigTablillas(linea_id, tipo_id, campo, valor) {
  const cfg = _ensureConfigTipo(linea_id, tipo_id);
  if (!cfg.tablillas) cfg.tablillas = { enabled: false, perfil_codigo: '', alto_tablilla: 80 };
  cfg.tablillas[campo] = valor;
  saveConfigTipo(linea_id, tipo_id);
  toast('Guardado');
  render(); // re-render to show/hide perfil selector
}

// Helper: renderiza una fila de config de perfil con dropdown
function _renderPerfilConfigRow(la, ta, pf, idx) {
  const condColor = pf.solo_si_n ? (pf.solo_si_n==='2' ? '#2B8EFF' : '#A855F7') : 'var(--text3)';
  const condBg    = pf.solo_si_n ? (pf.solo_si_n==='2' ? '#2B8EFF22' : '#A855F722') : 'transparent';
  const badgeN = pf.solo_si_n
    ? '<span style="font-size:10px;font-weight:700;color:'+condColor+';margin-right:5px;border:1px solid '+condColor+';padding:1px 5px;border-radius:3px;">N='+pf.solo_si_n+'</span>' : '';
  const rowStyle = pf.solo_si_n ? 'background:'+condBg+';' : '';
  const s = String.fromCharCode(39);

  const perfilesLinea = state.perfiles.filter(p => p.linea_id === la);

  let col1;
  if (!pf.codigo) {
    const selectOpts = perfilesLinea.map(p => {
      const cod = p.codigo || p.id || '';
      return '<option value="'+cod+'">'+(cod ? '['+cod+'] ' : '')+p.nombre+'</option>';
    }).join('');
    col1 = badgeN
      + '<select style="min-width:220px;font-size:12px;" '
      + 'onchange="seleccionarPerfilConfig('+s+la+s+','+s+ta+s+','+idx+',this.value)">'
      + '<option value="">-- Seleccionar perfil --</option>'
      + selectOpts
      + '</select>';
  } else {
    const cod = pf.codigo || '';
    const perfilObj = perfilesLinea.find(p => (p.codigo||p.id) === cod);
    const nombre = perfilObj ? perfilObj.nombre : (pf.rol || cod);
    const display = cod ? '['+cod+'] '+nombre : nombre;
    col1 = badgeN + '<span style="font-size:13px;color:var(--text);">'+display+'</span>';
  }

  const tv = pf.tipo_vidrio || 'siempre';

  return '<tr style="'+rowStyle+'">'
    +'<td style="min-width:220px;padding:8px 6px;">'+col1+'</td>'
    +'<td><input value="'+pf.cantidad+'" style="width:58px;font-family:monospace;font-size:13px;" '
    +'onchange="updateConfigPerfil('+s+la+s+','+s+ta+s+','+idx+','+s+'cantidad'+s+',this.value)"></td>'
    +'<td><input value="'+(pf.formula_largo||'')+'" placeholder="Ej: W - 42" style="width:150px;font-family:monospace;font-size:13px;" '
    +'onchange="updateConfigPerfil('+s+la+s+','+s+ta+s+','+idx+','+s+'formula_largo'+s+',this.value)"></td>'
    +'<td><select style="width:70px;font-size:12px;" '
    +'onchange="updateConfigPerfil('+s+la+s+','+s+ta+s+','+idx+','+s+'solo_si_n'+s+',this.value)">'
    +'<option value=""'+(!pf.solo_si_n?' selected':'')+'>Siempre</option>'
    +'<option value="1"'+(pf.solo_si_n==='1'?' selected':'')+'>N = 1</option>'
    +'<option value="2"'+(pf.solo_si_n==='2'?' selected':'')+'>N = 2</option>'
    +'<option value="3"'+(pf.solo_si_n==='3'?' selected':'')+'>N = 3</option>'
    +'<option value="4"'+(pf.solo_si_n==='4'?' selected':'')+'>N = 4</option>'
    +'</select></td>'
    +'<td><select style="width:82px;font-size:12px;" '
    +'onchange="updateConfigPerfil('+s+la+s+','+s+ta+s+','+idx+','+s+'tipo_vidrio'+s+',this.value)">'
    +'<option value="siempre"'+(tv==='siempre'?' selected':'')+'>Siempre</option>'
    +'<option value="vcomon"'+(tv==='vcomon'?' selected':'')+'>V. Comun</option>'
    +'<option value="dvh"'+(tv==='dvh'?' selected':'')+'>DVH</option>'
    +'</select></td>'
    +'<td><button class="btn-danger" '
    +'onclick="eliminarConfigPerfil('+s+la+s+','+s+ta+s+','+idx+')">x</button></td>'
    +'</tr>';
}

// Al seleccionar un perfil, guarda el codigo y rol
function seleccionarPerfilConfig(linea_id, tipo_id, idx, val) {
  if (!val) return;
  const cfg = _ensureConfigTipo(linea_id, tipo_id);
  if (!cfg.perfiles[idx]) return;
  const perfil = state.perfiles.find(p => (p.codigo || p.id) === val && p.linea_id === linea_id)
    || state.perfiles.find(p => (p.codigo || p.id) === val);
  cfg.perfiles[idx].codigo = val;
  cfg.perfiles[idx].rol = perfil ? perfil.nombre : val;
  saveConfigTipo(linea_id, tipo_id);
  render();
}

async function crearTipologiaCustom(linea_id) {
  const btn = document.getElementById('btnCrearTipo');
  const nombre = document.getElementById('nt_nombre')?.value?.trim();
  if (!nombre) { toast('Ingresá un nombre', 'error'); return; }
  const con_hojas = document.getElementById('nt_con_hojas')?.value === '1';
  const hojas_min     = Number(document.getElementById('nt_hojas_min')?.value) || 1;
  const hojas_max     = Number(document.getElementById('nt_hojas_max')?.value) || 4;
  const hojas_default = Number(document.getElementById('nt_hojas_default')?.value) || 1;

  // Generar id único basado en nombre
  const id = linea_id + '_custom_' + nombre.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_').slice(0, 30);

  // Verificar que no exista ya
  if (state.tipologias_custom.find(t => t.id === id)) {
    toast('Ya existe una tipología con ese nombre', 'error'); return;
  }

  setBtnLoading(btn, true, 'Creando...');
  try {
    const meta = { id, linea_id, nombre, con_hojas, hojas_min, hojas_max, hojas_default };
    state.tipologias_custom.push(meta);

    // Guardar metadatos en Config sheet
    const key = 'tipologia_custom_meta__' + id;
    await sheetsAppend(SHEETS.config, { id: genId(), key, value: JSON.stringify(meta) });

    // Crear config vacía para que aparezca en la sección de fórmulas
    if (!state.config_tipologias[linea_id]) state.config_tipologias[linea_id] = {};
    state.config_tipologias[linea_id][id] = { perfiles: [], vidrio: { formula_ancho: '', formula_alto: '' }, herrajes: [] };
    await saveConfigTipo(linea_id, id);

    // Navegar a la nueva tipología en config
    state._configLinea = linea_id;
    state._configTipo  = id;

    closeModal();
    toast('Tipología "' + nombre + '" creada');
    render();
  } catch(e) {
    toast('Error al crear tipología', 'error');
    setBtnLoading(btn, false);
  }
}

async function eliminarTipologiaCustom(id) {
  const t = state.tipologias_custom.find(x => x.id === id);
  if (!t) return;
  if (!confirm('¿Eliminar la tipología "' + t.nombre + '"? Se eliminarán también sus fórmulas configuradas.')) return;

  // Eliminar meta del Config sheet
  const configRows = await sheetsGet(SHEETS.config);
  const metaRow = configRows.find(r => r.key === 'tipologia_custom_meta__' + id);
  if (metaRow) await sheetsDeleteRow(SHEETS.config, metaRow.id);

  // Eliminar config de fórmulas del sheet
  const cfgKey = 'tipologia_' + t.linea_id + '__' + id;
  const cfgRow = configRows.find(r => r.key === cfgKey);
  if (cfgRow) await sheetsDeleteRow(SHEETS.config, cfgRow.id);

  // Limpiar state
  state.tipologias_custom = state.tipologias_custom.filter(x => x.id !== id);
  if (state.config_tipologias[t.linea_id]) {
    delete state.config_tipologias[t.linea_id][id];
  }

  // Volver al primer tipo de la línea
  const tipos = getTiposLinea(t.linea_id);
  state._configTipo = tipos[0]?.id || '';

  toast('Tipología eliminada');
  render();
}

// ============================================================
// ANÁLISIS DE MATERIALES (transición → compra materiales)
// ============================================================
function calcularNecesidadesMateriales(p) {
  const abs = state.aberturas.filter(a => a.presupuesto_id === p.id);
  const precioKg = getPrecioKgPresupuesto(p);

  // Agrupar mm necesarios por perfil en todo el presupuesto
  const necesidades = {}; // { perfilCodigo: { perfil, piezas: [{largo, desc}], mmTotal } }
  for (const a of abs) {
    const cant = Number(a.cantidad) || 1;
    const params = tryParse(a.params, {});
    const cortesRaw = a.es_modulo
      ? calcularModulo(a, state.perfiles, state.herrajes)
      : getCortesRaw(a.linea_id, a.tipo_id, Number(a.ancho), Number(a.alto), params, state.perfiles);
    for (const c of cortesRaw) {
      if (!c.perfil) continue;
      const k = c.perfil.codigo || c.perfil.id;
      if (!necesidades[k]) necesidades[k] = { perfil: c.perfil, piezas: [], mmTotal: 0 };
      // Repetir cada pieza por la cantidad de aberturas
      for (let i = 0; i < c.cantidad * cant; i++) {
        necesidades[k].piezas.push({ largo: c.largo, desc: c.desc, abertura: a.nombre + (cant > 1 ? " ("+cant+"u.)" : "") });
      }
      necesidades[k].mmTotal += c.largo * c.cantidad * cant;
    }
  }

  // Para cada perfil, cruzar con stock disponible
  const resultado = [];
  for (const [k, nec] of Object.entries(necesidades)) {
    const stockDisponible = state.stock.filter(s =>
      (s.perfil_id === nec.perfil.id || s.perfil_nombre?.includes('['+k+']') || s.perfil_nombre?.includes(nec.perfil.nombre))
      && Number(s.largo_mm) > 50
    );

    // Simular bin packing usando sobrantes primero
    const piezasOrdenadas = [...nec.piezas].sort((a, b) => b.largo - a.largo);
    const barrasStock = stockDisponible.map(s => ({ stockId: s.id, largo_mm: Number(s.largo_mm), perfil_nombre: s.perfil_nombre, resto: Number(s.largo_mm), usado: false }));
    const barrasNuevas = [];
    const stockUsado = []; // { stockId, largo_mm, piezas }

    const largoBarra = Number(nec.perfil.largo_barra) || 6000;

    for (const pieza of piezasOrdenadas) {
      let ok = false;
      // Intentar en stock primero
      for (const bs of barrasStock) {
        if (!bs.usado && bs.resto >= pieza.largo) {
          bs.resto -= pieza.largo;
          const existing = stockUsado.find(u => u.stockId === bs.stockId);
          if (existing) existing.piezas.push(pieza);
          else stockUsado.push({ stockId: bs.stockId, largo_mm: bs.largo_mm, perfil_nombre: bs.perfil_nombre, piezas: [pieza], restoFinal: bs.resto });
          ok = true;
          break;
        }
      }
      if (!ok) {
        // Barra nueva
        let barraActual = barrasNuevas[barrasNuevas.length - 1];
        if (!barraActual || barraActual.resto < pieza.largo) {
          barraActual = { largoBarra, resto: largoBarra, piezas: [], sobrante: 0 };
          barrasNuevas.push(barraActual);
        }
        barraActual.resto -= pieza.largo;
        barraActual.sobrante = barraActual.resto;
        barraActual.piezas.push(pieza);
      }
    }

    // Actualizar restoFinal en stockUsado
    for (const su of stockUsado) {
      const bs = barrasStock.find(b => b.stockId === su.stockId);
      if (bs) su.restoFinal = bs.resto;
    }

    const costoKg = Number(nec.perfil.peso_tira || 0) * getPrecioKgPresupuesto(p);
    const sobrantesNuevos = barrasNuevas
      .filter(b => b.sobrante > 50)
      .map(b => ({ perfil: nec.perfil, largo_mm: Math.round(b.sobrante) }));

    resultado.push({
      perfil: nec.perfil,
      codigo: k,
      mmTotal: nec.mmTotal,
      piezasTotal: nec.piezas.length,
      stockUsado,           // sobrantes del stock que se usan
      barrasNuevas,         // barras a comprar
      sobrantesNuevos,      // sobrantes que van a quedar de las barras nuevas
      costoEstimado: barrasNuevas.length * costoKg,
    });
  }
  return resultado;
}

  for (const a of analisis) {
    for (const su of a.stockUsado) {
      stockAConsumir.push({ ...su, perfil: a.perfil, codigo: a.codigo });
    }
  }

  // Sobrantes nuevos a generar
  const sobrantesNuevos = [];
  for (const a of analisis) {
    for (const sn of a.sobrantesNuevos) {
      sobrantesNuevos.push({ ...sn, codigo: a.codigo });
    }
  }

  const consumirHtml = stockAConsumir.length > 0
    ? stockAConsumir.map((su, i) => {
        const usadoMm = su.largo_mm - su.restoFinal;
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;">

            <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;">usa ${usadoMm}mm de ${su.largo_mm}mm disponibles ${su.restoFinal > 50 ? '→ queda '+su.restoFinal+'mm en stock' : '→ se consume completo'}</div>
          </div>
        </div>`;
      }).join('')
    : '<div style="color:var(--text3);font-size:13px;padding:8px 0;">Sin sobrantes de stock a consumir.</div>';

  const sobrantesHtml = sobrantesNuevos.length > 0
    ? sobrantesNuevos.map((sn, i) => {
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;">
          <input type="checkbox" id="sobrante_nuevo_${i}" checked style="accent-color:var(--accent);width:16px;height:16px;">

            <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;">${sn.largo_mm}mm de sobrante</div>
          </div>
        </div>`;
      }).join('')
    : '<div style="color:var(--text3);font-size:13px;padding:8px 0;">Las barras compradas no generan sobrantes significativos.</div>';

  // Guardar análisis en window para usar al confirmar
  window._kanbanAnalisis = { presupuestoId: p.id, stockAConsumir, sobrantesNuevos, presupuesto: p };

  showModal(`
    <div class="modal-title">Confirmar paso a Construcción</div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:18px;">${p.cliente} — ${p.obra}</div>

    <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.04em;">
      📦 Sobrantes de stock a consumir
    </div>
    <div style="max-height:200px;overflow-y:auto;margin-bottom:18px;">${consumirHtml}</div>

    <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.04em;">
      ✨ Sobrantes nuevos a agregar al stock
    </div>
    <div style="max-height:200px;overflow-y:auto;margin-bottom:18px;">${sobrantesHtml}</div>

    <div style="font-size:11px;color:var(--text3);padding:8px 12px;background:var(--bg);border-radius:6px;margin-bottom:18px;">
      ⚠️ Esta acción modifica el stock. Los sobrantes marcados se eliminarán/agregarán al confirmar.
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" id="btnConfirmarConstruccion" onclick="confirmarPasarAConstruccion()">Confirmar y actualizar stock</button>
    </div>`);
}

async function confirmarPasarAConstruccion() {
  const btn = document.getElementById('btnConfirmarConstruccion');
  setBtnLoading(btn, true, 'Actualizando...');
  try {
    const { presupuestoId, stockAConsumir, sobrantesNuevos, presupuesto: p } = window._kanbanAnalisis;

    // 1. Eliminar del stock los sobrantes marcados para consumir
    for (let i = 0; i < stockAConsumir.length; i++) {
      const checked = document.getElementById('consumir_' + i)?.checked;
      if (!checked) continue;
      const su = stockAConsumir[i];
      // Eliminar el sobrante original del stock
      state.stock = state.stock.filter(s => s.id !== su.stockId);
      await sheetsDeleteRow(SHEETS.stock, su.stockId);
      // Si quedó un resto significativo, lo volvemos a agregar como sobrante nuevo
      if (su.restoFinal > 50) {
        const linea = state.lineas.find(l => l.id === su.perfil?.linea_id) || {};
        const nuevoSobrante = {
          id: genId(),
          perfil_id: su.perfil?.id || '',
          perfil_nombre: su.perfil_nombre || su.perfil?.nombre || '',
          linea: linea.nombre || '',
          largo_mm: su.restoFinal,
          nota: 'Resto de sobrante usado en ' + p.cliente + ' — ' + p.obra,
          fecha: today(),
        };
        state.stock.push(nuevoSobrante);
        await sheetsAppend(SHEETS.stock, nuevoSobrante);
      }
    }

    // 2. Agregar al stock los sobrantes nuevos marcados
    for (let i = 0; i < sobrantesNuevos.length; i++) {
      const checked = document.getElementById('sobrante_nuevo_' + i)?.checked;
      if (!checked) continue;
      const sn = sobrantesNuevos[i];
      const linea = state.lineas.find(l => l.id === sn.perfil?.linea_id) || {};
      const s = {
        id: genId(),
        perfil_id: sn.perfil?.id || '',
        perfil_nombre: sn.perfil?.nombre + (sn.codigo ? ' [' + sn.codigo + ']' : ''),
        linea: linea.nombre || '',
        largo_mm: sn.largo_mm,
        nota: 'Sobrante de obra: ' + p.cliente + ' — ' + p.obra,
        fecha: today(),
      };
      state.stock.push(s);
      await sheetsAppend(SHEETS.stock, s);
    }

    closeModal();
    const pp = state.presupuestos.find(x => x.id === presupuestoId);
    await _ejecutarMoverKanban(pp, 'construccion');
    toast('Stock actualizado y obra en construcción ✓');
  } catch(e) {
    console.error(e);
    toast('Error al actualizar stock', 'error');
    setBtnLoading(btn, false);
  }
}

// EDICION HERRAJES EN ABERTURA
// ============================================================
function _getHerrajesSnapAb(a) {
  // Si ya es array en memoria, usarlo directamente
  if (Array.isArray(a.herrajes_snap) && a.herrajes_snap.length > 0) return a.herrajes_snap;
  // Si es string, parsearlo
  const parsed = tryParse(a.herrajes_snap, null);
  if (Array.isArray(parsed) && parsed.length > 0) return parsed;
  // Fallback: construir desde tipo (abertura sin snap todavia)
  const _prms = tryParse(a.params, {});
  return getHerrajesTipo(a.linea_id, a.tipo_id, { ..._prms, ancho: Number(a.ancho||0), alto: Number(a.alto||0) }).map(h => {
    const hObj = state.herrajes.find(x => x.id === h.id);
    return { id: h.id, nombre: hObj?.nombre || h.descripcion || h.id, cantidad: h.cantidad, precio: Number(hObj?.precio || 0), unidad: hObj?.unidad || 'u' };
  });
}

// Muestra overlay de guardado sobre la card de una abertura
function _showSavingOverlay(abId) {
  const cards = document.querySelectorAll('.ab-card');
  // Buscar la card que contiene botones con el abId
  for (const card of cards) {
    if (card.innerHTML.includes(abId)) {
      const ov = document.createElement('div');
      ov.id = 'saving_' + abId;
      ov.style.cssText = 'position:absolute;inset:0;background:rgba(10,15,30,0.6);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text2);font-size:13px;z-index:10;';
      ov.innerHTML = '<div class="spinner"></div> Guardando...';
      card.style.position = 'relative';
      card.appendChild(ov);
      return;
    }
  }
}
function _hideSavingOverlay(abId) {
  document.getElementById('saving_' + abId)?.remove();
}

async function _guardarHerrajesSnap(a) {
  // Asegurar que herrajes_snap sea array en memoria
  if (!Array.isArray(a.herrajes_snap)) {
    a.herrajes_snap = tryParse(a.herrajes_snap, []);
  }
  a.costo_herrajes = a.herrajes_snap.reduce((s, h) => s + Number(h.precio) * Number(h.cantidad), 0);
  await sheetsUpdateRow(SHEETS.aberturas, a.id, {
    herrajes_snap: JSON.stringify(a.herrajes_snap),
    costo_herrajes: a.costo_herrajes,
  });
  await recalcularTotal();
}



async function eliminarHerrajeAbertura(abId, hi) {
  const a = state.aberturas.find(x => x.id === abId);
  if (!a) return;
  _showSavingOverlay(abId);
  try {
    const snap = _getHerrajesSnapAb(a).map(h => ({...h}));
    snap.splice(hi, 1);
    a.herrajes_snap = snap;
    await _guardarHerrajesSnap(a);
  } finally {
    _hideSavingOverlay(abId);
    render();
  }
}

async function eliminarAbertura(id) {
  if (!confirm('¿Eliminar esta abertura? Los costos del presupuesto se recalcularán.')) return;

  // Mostrar loading en toda la página
  const root = document.getElementById('appRoot');
  const originalContent = root.innerHTML;
  root.innerHTML += '<div style="position:fixed;inset:0;background:rgba(10,15,30,0.7);z-index:500;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--text2);font-size:14px;"><div class="spinner"></div> Recalculando...</div>';

  try {
    state.aberturas = state.aberturas.filter(a => a.id !== id);
    await sheetsDeleteRow(SHEETS.aberturas, id);

    const p = state.presupuestos.find(x => x.id === state.presupuestoActivo);
    if (p) {
      const precioKg = getPrecioKgPresupuesto(p);
      const absRestantes = state.aberturas.filter(a => a.presupuesto_id === state.presupuestoActivo);
      let barrasAcumuladas = {};
      for (const a of absRestantes) {
        const params = tryParse(a.params, {});
        const res = calcularAbertura(
          a.linea_id, a.tipo_id,
          Number(a.ancho), Number(a.alto),
          params, state.perfiles, state.herrajes,
          Number(a.precio_vidrio || 8500), precioKg,
          barrasAcumuladas
        );
        if (!res) continue;
        a.costo_perfiles = res.costoPerfiles;
        a.costo_vidrios  = res.costoVidrios;
        a.costo_herrajes = res.costoHerrajes;
        a.optimizacion   = JSON.stringify(res.optimizacion);
        a.vidrios        = JSON.stringify(res.vidrios);
        await sheetsUpdateRow(SHEETS.aberturas, a.id, {
          costo_perfiles: res.costoPerfiles,
          costo_vidrios:  res.costoVidrios,
          costo_herrajes: res.costoHerrajes,
          optimizacion:   JSON.stringify(res.optimizacion),
          vidrios:        JSON.stringify(res.vidrios),
        });
        barrasAcumuladas = res.barrasFinales;
      }
    }
    await recalcularTotal();
    toast('Abertura eliminada — costos recalculados');
  } catch(e) {
    toast('Error al eliminar', 'error');
  } finally {
    render();
  }
}

async function recalcularTotal() {
  const p = state.presupuestos.find(x => x.id === state.presupuestoActivo);
  if (!p) return;
  const abs = state.aberturas.filter(a => a.presupuesto_id === p.id);
  const precioKg = getPrecioKgPresupuesto(p);
  const { costos, costoSobranteNuevas } = calcularCostoAberturas(abs, state.perfiles, state.herrajes, precioKg, state._criterioPrecio || 'barra_completa', state.umbral_sobrante);
  const sub = Object.values(costos).reduce((s, c) => s + c.perfiles + c.vidrios + c.herrajes, 0);
  const cobrarSobrante = (state._criterioPrecio === 'proporcional') && p.cobrar_sobrante;
  const costoSobrante = cobrarSobrante ? (costoSobranteNuevas || 0) : 0;
  const total = sub * (1 + Number(p.markup||0) / 100) + costoSobrante;
  p.total_final = total;
  p.costo_sobrante = costoSobrante;
  await sheetsUpdateRow(SHEETS.presupuestos, p.id, { total_final: total, costo_sobrante: costoSobrante });
}

async function eliminarPresupuesto(id) {
  const p = state.presupuestos.find(x => x.id === id);
  if (!p) return;
  if (p.estado !== 'generado') { toast('Solo se pueden eliminar presupuestos en estado Generado', 'error'); return; }
  if (!confirm(`¿Eliminar el presupuesto de ${p.cliente} — ${p.obra}? Esta acción no se puede deshacer.`)) return;
  // Eliminar aberturas asociadas
  const absDelPpto = state.aberturas.filter(a => a.presupuesto_id === id);
  for (const a of absDelPpto) {
    await sheetsDeleteRow(SHEETS.aberturas, a.id);
  }
  state.aberturas = state.aberturas.filter(a => a.presupuesto_id !== id);
  // Eliminar presupuesto
  state.presupuestos = state.presupuestos.filter(x => x.id !== id);
  await sheetsDeleteRow(SHEETS.presupuestos, id);
  toast('Presupuesto eliminado');
  render();
}

function showModal(html) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modalOverlay';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { document.querySelectorAll('#modalOverlay').forEach(el => el.remove()); }
function updateModal(content) {
  const existing = document.getElementById('modalOverlay');
  if (existing) {
    existing.querySelector('.modal').innerHTML = content;
  } else {
    showModal(content);
  }
}

function showModalNuevoPresupuesto() {
  const lineaOpts = state.lineas.map(l => `<option value="${l.id}">${l.nombre}</option>`).join('');
  showModal(`
    <div class="modal-title">Nuevo Presupuesto</div>
    <div class="form-group"><label>Cliente</label><input id="m_cliente" placeholder="Nombre del cliente"></div>
    <div class="form-group"><label>Obra / Descripcion</label><input id="m_obra" placeholder="Ej: Casa Martínez - Dormitorio"></div>
    <div class="form-group">
      <label>Linea de aluminio</label>
      <select id="m_linea_ppto" onchange="updateTiposYPrecios()">${lineaOpts}</select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo de aluminio</label>
        <select id="m_tipo_al" onchange="updateTiposYPrecios()">
          <option value="nuevo">Nuevo</option>
          <option value="recuperado" selected>Recuperado</option>
        </select>
      </div>
      <div class="form-group">
        <label>Color</label>
        <select id="m_color_al" onchange="updatePrecioKg()"></select>
      </div>
    </div>
    <div class="form-group">
      <label>Precio por kg ($/kg)</label>
      <input type="number" id="m_precio_kg" placeholder="Se completa automáticamente" style="font-family:'DM Mono',monospace">
    </div>
    <div class="form-group"><label>Fecha</label><input id="m_fecha" value="${today()}"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="crearPresupuesto()">Crear →</button>
    </div>`);
  updateTiposYPrecios();
}

function updateTiposYPrecios() {
  const linea_id = document.getElementById('m_linea_ppto')?.value;
  const tipo = document.getElementById('m_tipo_al')?.value || 'nuevo';
  const colorSel = document.getElementById('m_color_al');
  const precioInput = document.getElementById('m_precio_kg');

  // Si no hay colores cargados para esta linea en state, recargar desde Sheet
  const preciosFiltrados = state.precios_kg.filter(p => p.linea_id === linea_id && p.tipo === tipo);
  if (!preciosFiltrados.length) {
    // Mostrar loading y recargar
    if (colorSel) colorSel.innerHTML = '<option>Cargando...</option>';
    sheetsGet(SHEETS.precios_kg).then(rows => {
      // Actualizar state con los nuevos datos
      rows.forEach(r => {
        if (!state.precios_kg.find(p => p.id === r.id)) {
          state.precios_kg.push(r);
        }
      });
      // Ahora sí filtrar y poblar
      const filtered = state.precios_kg.filter(p => p.linea_id === linea_id && p.tipo === tipo);
      const colores = [...new Set(filtered.map(p => p.nombre))];
      if (colorSel) colorSel.innerHTML = colores.map(c => `<option value="${c}">${c}</option>`).join('');
      updatePrecioKg();
    }).catch(() => {
      if (colorSel) colorSel.innerHTML = '<option>Sin colores</option>';
    });
    return;
  }

  const colores = [...new Set(preciosFiltrados.map(p => p.nombre))];
  if (colorSel) {
    colorSel.innerHTML = colores.map(c => `<option value="${c}">${c}</option>`).join('');
  }
  updatePrecioKg();
}

function updatePrecioKg() {
  const linea_id = document.getElementById('m_linea_ppto')?.value;
  const tipo  = document.getElementById('m_tipo_al')?.value;
  const color = document.getElementById('m_color_al')?.value;
  const match = state.precios_kg.find(p => p.linea_id === linea_id && p.tipo === tipo && p.nombre === color);
  const input = document.getElementById('m_precio_kg');
  if (input && match) input.value = match.precio_kg;
}

function updatePrecioVidrio() {
  const subtipoId = document.getElementById('m_subtipo_vidrio')?.value;
  const subtipo = state.tipos_vidrio?.find(t => t.id === subtipoId);
  const input = document.getElementById('m_pvid');
  if (!input) return;
  // El precio viene SOLO del tipo de vidrio seleccionado
  if (subtipo && !input.dataset.userModified) {
    input.value = subtipo.precio;
  }
}

async function crearPresupuesto() {
  const btn = document.querySelector('#modalOverlay .btn-primary');
  if (btn?.disabled) return; // evitar doble submit
  const cliente   = document.getElementById('m_cliente')?.value?.trim();
  const obra      = document.getElementById('m_obra')?.value?.trim();
  const fecha     = document.getElementById('m_fecha')?.value;
  const linea_id  = document.getElementById('m_linea_ppto')?.value || 'modena';
  const tipo_al   = document.getElementById('m_tipo_al')?.value || 'nuevo';
  const color_al  = document.getElementById('m_color_al')?.value || 'Blanco';
  const precio_kg = parseFloat(document.getElementById('m_precio_kg')?.value) || 0;
  const linea     = state.lineas.find(l => l.id === linea_id);
  if (!cliente || !obra) { toast('Completá cliente y obra', 'error'); return; }
  setBtnLoading(btn, true, 'Creando...');
  try {
    const p = { id: genId(), cliente, obra, fecha, estado: 'generado', markup: 60, total_final: 0, kanban_col: '', linea_id, linea: linea?.nombre || linea_id, tipo_al, color_al, precio_kg, cobrar_sobrante: false, costo_sobrante: 0 };
    state.presupuestos.unshift(p);
    await sheetsAppend(SHEETS.presupuestos, p);
    closeModal();
    state.presupuestoActivo = p.id;
    state._tab = 'aberturas';
    toast('Presupuesto creado');
    render();
  } catch(e) {
    toast('Error al crear presupuesto', 'error');
    setBtnLoading(btn, false);
  }
}

function showEditModulo(abId) {
  const a = state.aberturas.find(x => x.id === abId);
  if (!a) return;
  let secciones = a.secciones;
  if (!Array.isArray(secciones)) secciones = tryParse(secciones, []);
  if (!Array.isArray(secciones)) secciones = [];
  window._editandoModuloId = abId;
  window._moduloSecciones = secciones.map(s => ({ ...s, params: (typeof s.params === 'string' ? tryParse(s.params, {}) : (s.params || {})) }));
  window._moduloOrient = a.modulo_orient || 'h';
  window._moduloAlto = (window._moduloOrient === 'h') ? Number(a.alto) : 1000;
  window._moduloAncho = (window._moduloOrient === 'v') ? Number(a.ancho) : 1000;
  window._moduloCant = Number(a.cantidad) || 1;
  window._moduloNomenclatura = a.nomenclatura || '';
  window._moduloSecTipo = getTiposLinea(a.linea_id)[0]?.id || null;
  window._moduloSecAncho = '';
  window._moduloSecAlto = '';
  window._moduloSecTv = 'vcomon';
  _renderModalModulo();
}

function showAddModulo() {

function _renderModalModulo() {
  const secciones = window._moduloSecciones || [];
  const orient    = window._moduloOrient || 'h'; // 'h' horizontal, 'v' vertical
  const esH       = orient === 'h';
  const alto      = window._moduloAlto  || 1000;
  const ancho     = window._moduloAncho || 1000;
  const cant      = window._moduloCant  || 1;

  // Dimension totals
  const anchoTotal = esH ? secciones.reduce((s, sec) => s + Number(sec.ancho||0), 0) : ancho;
  const altoTotal  = esH ? alto : secciones.reduce((s, sec) => s + Number(sec.alto||0), 0);

  // Sections list
  const seccionesHtml = secciones.length
    ? secciones.map((sec, i) => {

          + '<button onclick="_eliminarSeccion(' + i + ')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:14px;">x</button>'
          + '</div>';
      }).join('')
    : '<div style="font-size:12px;color:var(--text3);padding:8px;">Agrega secciones con el boton de abajo</div>';

  // SVG preview
  const svgSecs = esH
    ? secciones.map(s => ({...s, ancho: Number(s.ancho), alto: alto}))
    : secciones.map(s => ({...s, ancho: ancho, alto: Number(s.alto)}));
  const svgPreview = secciones.length
    ? (esH ? svgModulo(svgSecs, alto, 300, 120) : svgModuloV(svgSecs, ancho, 120, 200))
    : '';

  const puedeAgregar = secciones.length >= 2;

  // Fixed dimension field
  const fixedDimField = esH
    ? '<div class="form-group" style="flex:1;"><label>Alto vano (mm)</label><input type="number" id="mod_alto" value="' + alto + '" oninput="window._moduloAlto=Number(this.value);_actualizarSvgModulo()"></div>'
    : '<div class="form-group" style="flex:1;"><label>Ancho vano (mm)</label><input type="number" id="mod_ancho_fijo" value="' + ancho + '" oninput="window._moduloAncho=Number(this.value);_actualizarSvgModulo()"></div>';

  // Variable dimension field label
  const varDimLabel = esH ? 'Ancho (mm)' : 'Alto (mm)';
  const varDimId    = esH ? 'mod_sec_ancho' : 'mod_sec_alto';
  const varDimVal   = esH ? (window._moduloSecAncho||'') : (window._moduloSecAlto||'');
  const varDimHint  = esH ? '800' : '1200';

  // Total label
  const totalLabel = esH
    ? 'Secciones · Ancho total: ' + anchoTotal + 'mm'
    : 'Secciones · Alto total: ' + altoTotal + 'mm';

  const _editandoMod = !!window._editandoModuloId;
  updateModal(
    '<div class="modal-title">' + (_editandoMod ? 'Editar Modulo Compuesto' : 'Modulo Compuesto') + '</div>'
    // Orientacion selector
    + '<div style="display:flex;gap:8px;margin-bottom:14px;">'
    +   '<button id="mod_btn_h" onclick="window._moduloOrient=\'h\';_renderModalModulo()" '
    +     'style="flex:1;padding:8px;border-radius:8px;border:2px solid ' + (esH ? 'var(--accent)' : 'var(--border)') + ';background:' + (esH ? 'var(--accent)11' : 'transparent') + ';color:' + (esH ? 'var(--accent)' : 'var(--text3)') + ';cursor:pointer;font-size:13px;font-weight:600;">'
    +     '⬌ Horizontal</button>'
    +   '<button id="mod_btn_v" onclick="window._moduloOrient=\'v\';_renderModalModulo()" '
    +     'style="flex:1;padding:8px;border-radius:8px;border:2px solid ' + (!esH ? 'var(--accent)' : 'var(--border)') + ';background:' + (!esH ? 'var(--accent)11' : 'transparent') + ';color:' + (!esH ? 'var(--accent)' : 'var(--text3)') + ';cursor:pointer;font-size:13px;font-weight:600;">'
    +     '⬍ Vertical</button>'
    + '</div>'
    + '<div class="form-row" style="gap:12px;margin-bottom:12px;">'
    + fixedDimField
    + '<div class="form-group" style="flex:1;"><label>Cantidad</label><input type="number" id="mod_cant" value="' + cant + '" min="1" oninput="_moduloCant=Number(this.value)||1"></div>'
    + '</div>'
    + '<div class="form-group" style="margin-bottom:12px;"><label>Nomenclatura (opcional)</label><input type="text" id="mod_nomenclatura" placeholder="Ej: V1, L4..." value="' + (window._moduloNomenclatura || '') + '" oninput="window._moduloNomenclatura=this.value"></div>'
    + '<div id="mod_ancho_total" style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">' + totalLabel + '</div>'

    + '<div style="border:1px dashed var(--border);border-radius:8px;padding:12px;margin-top:8px;" id="mod_add_panel">'
    + '<div style="font-size:12px;color:var(--text3);margin-bottom:8px;">Agregar seccion</div>'
    + _buildTipologiaSelect(window._moduloSecTipo || '')
    + '<div class="form-row" style="gap:8px;margin-top:8px;">'
    + '<div class="form-group" style="flex:1;min-width:90px;"><label>' + varDimLabel + '</label>'
    + '<input type="number" id="' + varDimId + '" value="' + varDimVal + '" placeholder="' + varDimHint + '" style="font-family:monospace;"></div>'
    + '</div>'
    + '<div id="mod_sec_params_wrap">'
    + _buildSeccionParamsHtml((state.presupuestos.find(x=>x.id===state.presupuestoActivo)?.linea_id || state.lineas[0]?.id || 'modena'), window._moduloSecTipo || '', (window._moduloSecciones||[]).length)
    + '</div>'
    + '<button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="_agregarSeccion()">+ Agregar seccion</button>'
    + '</div>'
    + '<div class="modal-actions" style="margin-top:12px;">'
    + '<button class="btn-secondary" onclick="window._editandoModuloId=null;closeModal()">Cancelar</button>'
    + '<button class="btn-primary" id="btnAgregarModulo" onclick="confirmarAgregarModulo()" ' + (!puedeAgregar?'disabled style="opacity:0.5;"':'') + '>' + (_editandoMod ? 'Guardar cambios' : 'Agregar modulo') + '</button>'
    + '</div>'
  );
}

function _buildTipologiaSelect(currentVal) {
  const p = state.presupuestos.find(x => x.id === state.presupuestoActivo);
  const lineaId = p?.linea_id || state.lineas[0]?.id || 'modena';
  const tipos = getTiposLinea(lineaId);
  const opts = tipos.map(t => '<option value="' + t.id + '"' + (t.id === currentVal ? ' selected' : '') + '>' + t.nombre + '</option>').join('');
  return '<div class="form-group" style="flex:2;min-width:150px;"><label>Tipologia</label>'
    + '<select id="mod_sec_tipo" onchange="_guardarSeleccionSeccion()">' + opts + '</select></div>';
}

function _guardarSeleccionSeccion() {
  window._moduloSecTipo = document.getElementById('mod_sec_tipo')?.value;
  window._moduloSecAncho = document.getElementById('mod_sec_ancho')?.value || '';
  window._moduloSecAlto  = document.getElementById('mod_sec_alto')?.value || '';
  // Refrescar panel de params según tipología seleccionada
  const wrap = document.getElementById('mod_sec_params_wrap');
  if (wrap) {
    const _pAct = state.presupuestos.find(x => x.id === state.presupuestoActivo);
    const linea = _pAct?.linea_id || state.lineas[0]?.id || 'modena';
    const secIdx = (window._moduloSecciones || []).length;
    wrap.innerHTML = _buildSeccionParamsHtml(linea, window._moduloSecTipo || '', secIdx);
  }
}

function _agregarSeccion() {
  const sel = document.getElementById('mod_sec_tipo');
  const tipoId = sel ? sel.options[sel.selectedIndex]?.value : '';
  const esH    = (window._moduloOrient || 'h') === 'h';
  const dimInput = document.getElementById(esH ? 'mod_sec_ancho' : 'mod_sec_alto');
  const dimVal = Number(dimInput?.value) || 0;
  const ancho  = esH ? dimVal : (window._moduloAncho || Number(document.getElementById('mod_ancho_fijo')?.value) || 1000);
  const altoV  = !esH ? dimVal : 0;
  if (!tipoId || !dimVal) { toast('Completa tipologia y ' + (esH ? 'ancho' : 'alto'), 'error'); return; }

  const _pActSec = state.presupuestos.find(x => x.id === state.presupuestoActivo);
  const tipos = getTiposLinea(_pActSec?.linea_id || state.lineas[0]?.id || 'modena');
  const tipo = tipos.find(t => t.id === tipoId);
  const secIdx = (window._moduloSecciones || []).length;

  // Leer params del formulario
  const subtipoId = document.getElementById('sec_tv_' + secIdx)?.value;
  const subtipoObj = state.tipos_vidrio?.find(t => t.id === subtipoId);
  const tipoVidrio = subtipoObj?.tipo_base || 'vcomon';
  const precioVidrio = Number(document.getElementById('sec_pvid_' + secIdx)?.value) || subtipoObj?.precio || 8500;
  const pctTab = Number(document.getElementById('sec_pct_tab_' + secIdx)?.value) || 0;
  const tabPos = document.querySelector(`input[name="sec_tab_pos_${secIdx}"]:checked`)?.value || 'abajo';
  const conPremarco = document.getElementById('sec_premarco_' + secIdx)?.checked || false;

  // Hojas desde params
  const hojasInput = document.getElementById('sec_param_' + secIdx + '_hojas');
  const hojas = Number(hojasInput?.value) || Number(tipo?.params?.find(p=>p.id==='hojas')?.default) || 1;

  const params = {
    tipo_vidrio: tipoVidrio,
    subtipo_vidrio_id: subtipoId,
    subtipo_vidrio_nombre: subtipoObj?.nombre || '',
    hojas,
    ...(pctTab > 0 ? { pct_tablillas: pctTab, tab_pos: tabPos } : {}),
    ...(conPremarco ? { con_premarco: true } : {}),
  };

  if (!window._moduloSecciones) window._moduloSecciones = [];
  const altoSec = !esH ? altoV : 0;
  window._moduloSecciones.push({
    tipologia_id: tipoId,
    nombre: tipo?.nombre || tipoId,
    ancho,
    alto: altoSec || undefined,
    tipo_vidrio: tipoVidrio,
    precio_vidrio: precioVidrio,
    params,
  });

  window._moduloSecTipo = tipoId;
  window._moduloAlto = Number(document.getElementById('mod_alto')?.value) || 1000;
  window._moduloCant = Number(document.getElementById('mod_cant')?.value) || 1;
  if (esH) window._moduloSecAncho = ''; else window._moduloSecAlto = '';
  _actualizarSeccionesUI();
}

function _actualizarSeccionesUI() {
  const secciones = window._moduloSecciones || [];
  const esH = (window._moduloOrient || 'h') === 'h';
  const alto = window._moduloAlto || 1000;
  const ancho = window._moduloAncho || 1000;

  const wrap = document.getElementById('mod_secciones');
  if (wrap) {
    if (!secciones.length) {
      wrap.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px;">Agrega secciones con el boton de abajo</div>';
    } else if (esH) {
      wrap.innerHTML = secciones.map((sec, i) =>
        '<div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg);border-radius:8px;margin-bottom:6px;">'
        + '<div style="flex:1;font-size:13px;color:var(--text);">' + sec.nombre + '</div>'
        + '<div style="font-size:12px;color:var(--text3);">' + sec.ancho + 'mm</div>'
        + '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:' + (sec.tipo_vidrio==='dvh'?'#00E5A022':'#0ea5e922') + ';color:' + (sec.tipo_vidrio==='dvh'?'var(--accent)':'#0ea5e9') + ';">' + (sec.tipo_vidrio==='dvh'?'DVH':'V.Comun') + '</span>'
        + '<button onclick="_eliminarSeccion(' + i + ')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:14px;">x</button>'
        + '</div>'
      ).join('');
    } else {
      const totalAlto = secciones.reduce((s, sec) => s + Number(sec.alto||0), 0);
      wrap.innerHTML = '<div style="display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;">'
        + secciones.map((sec, i) => {
            const pct = totalAlto > 0 ? Math.round((Number(sec.alto||0)/totalAlto)*100) : 0;
            return '<div style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg);border-bottom:1px solid var(--border);">'
              + '<div style="width:4px;background:var(--accent);border-radius:2px;align-self:stretch;min-height:28px;flex-shrink:0;"></div>'
              + '<div style="flex:1;">'
              +   '<div style="font-size:13px;color:var(--text);">' + sec.nombre + '</div>'
              +   '<div style="font-size:11px;color:var(--text3);">' + sec.alto + 'mm · ' + pct + '% del alto</div>'
              + '</div>'
              + '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:' + (sec.tipo_vidrio==='dvh'?'#00E5A022':'#0ea5e922') + ';color:' + (sec.tipo_vidrio==='dvh'?'var(--accent)':'#0ea5e9') + ';">' + (sec.tipo_vidrio==='dvh'?'DVH':'V.Comun') + '</span>'
              + '<button onclick="_eliminarSeccion(' + i + ')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:14px;">x</button>'
              + '</div>';
          }).join('')
        + '</div>';
    }
  }

  const svgWrap = document.getElementById('mod_svg_wrap');
  if (svgWrap) {
    if (!secciones.length) {
      svgWrap.innerHTML = '';
    } else if (esH) {
      svgWrap.innerHTML = svgModulo(secciones.map(s => ({...s, alto})), alto, 300, 120);
    } else {
      svgWrap.innerHTML = svgModuloV(secciones.map(s => ({...s, ancho})), ancho, 120, 200);
    }
  }

  const esH2 = esH;
  const anchoTotal = esH2 ? secciones.reduce((s, sec) => s + Number(sec.ancho||0), 0) : ancho;
  const altoTotal  = !esH2 ? secciones.reduce((s, sec) => s + Number(sec.alto||0), 0) : alto;
  const totalLabel = document.getElementById('mod_ancho_total');
  if (totalLabel) totalLabel.textContent = esH2
    ? 'Secciones · Ancho total: ' + anchoTotal + 'mm'
    : 'Secciones · Alto total: ' + altoTotal + 'mm';

  const btn = document.getElementById('btnAgregarModulo');
  if (btn) { btn.disabled = secciones.length < 2; btn.style.opacity = secciones.length < 2 ? '0.5' : '1'; }

  const anchoInput = document.getElementById('mod_sec_ancho');
  if (anchoInput) anchoInput.value = '';
}

function _eliminarSeccion(i) {
  if (window._moduloSecciones) window._moduloSecciones.splice(i, 1);
  _actualizarSeccionesUI();
}

function _actualizarSvgModulo() {
  const wrap = document.getElementById('mod_svg_wrap');
  if (!wrap || !window._moduloSecciones?.length) return;
  const esH = (window._moduloOrient || 'h') === 'h';
  if (esH) {
    const alto = Number(document.getElementById('mod_alto')?.value) || 1000;
    wrap.innerHTML = svgModulo(window._moduloSecciones.map(s => ({...s, alto})), alto, 300, 120);
  } else {
    const ancho = Number(document.getElementById('mod_ancho_fijo')?.value) || 1000;
    wrap.innerHTML = svgModuloV(window._moduloSecciones.map(s => ({...s, ancho})), ancho, 120, 200);
  }
}

async function confirmarAgregarModulo() {
  const btn = document.getElementById('btnAgregarModulo');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke-linecap="round"/></svg> Calculando...</span>';
  }
  try {
    const secciones = window._moduloSecciones || [];
    const alto = Number(document.getElementById('mod_alto')?.value) || 1000;
    const cant = Number(document.getElementById('mod_cant')?.value) || 1;
    if (secciones.length < 2) { toast('Agrega al menos 2 secciones', 'error'); setBtnLoading(btn, false); return; }

    const esH = (window._moduloOrient || 'h') === 'h';
    const anchoTotal = esH
      ? secciones.reduce((s, sec) => s + Number(sec.ancho||0), 0)
      : (window._moduloAncho || Number(document.getElementById('mod_ancho_fijo')?.value) || 1000);
    const altoTotal = esH
      ? (window._moduloAlto || Number(document.getElementById('mod_alto')?.value) || 1000)
      : secciones.reduce((s, sec) => s + Number(sec.alto||0), 0);
    // In vertical mode, assign the fixed ancho to each section
    if (!esH) secciones.forEach(s => { if (!s.ancho) s.ancho = anchoTotal; });
    // In horizontal mode, assign the fixed alto to each section
    if (esH) secciones.forEach(s => { if (!s.alto) s.alto = altoTotal; });
    const nombre = secciones.map(s => s.nombre).join(esH ? ' + ' : ' / ');
    const p = state.presupuestos.find(x => x.id === state.presupuestoActivo);
    const linea_id = p?.linea_id || state.lineas[0]?.id || 'modena';
    const linea = state.lineas.find(l => l.id === linea_id) || state.lineas[0];
    const precioKg = getPrecioKgPresupuesto(p);
    const nomenclatura = (document.getElementById('mod_nomenclatura')?.value || window._moduloNomenclatura || '').trim();

    const seccionesJson = JSON.stringify(secciones);
    const ab = {
      id: genId(),
      presupuesto_id: state.presupuestoActivo,
      linea_id,
      linea: linea?.nombre || linea_id,
      tipo_id: 'modulo-compuesto',
      nombre,
      nomenclatura,
      ancho: anchoTotal, alto: altoTotal, cantidad: cant,
      params: JSON.stringify({}),
      precio_vidrio: 0,
      precio_kg: precioKg,
      es_modulo: 'true',
      modulo_orient: esH ? 'h' : 'v',
      secciones: seccionesJson,
      costo_perfiles: 0, costo_vidrios: 0, costo_herrajes: 0,
      optimizacion: '[]', vidrios: '[]',
      perfiles_snap: JSON.stringify(state.perfiles.filter(pf => pf.linea_id === linea_id)
        .map(pf => ({ id: pf.id, linea_id: pf.linea_id, codigo: pf.codigo, nombre: pf.nombre, peso_tira: pf.peso_tira, largo_barra: pf.largo_barra }))),
      herrajes_snap: '[]',
    };
    // In-memory: use proper types
    ab._esModuloMem = true;
    ab._seccionesMem = secciones;

    // Calculate costs using in-memory normalized object
    const abMem = { ...ab, es_modulo: true, secciones };
    const _editandoModId = window._editandoModuloId;
    if (_editandoModId) abMem.id = _editandoModId, ab.id = _editandoModId;
    const absExistentes = state.aberturas.filter(a => a.presupuesto_id === state.presupuestoActivo && a.id !== _editandoModId);
    const { costos } = calcularCostoAberturas([...absExistentes, abMem], state.perfiles, state.herrajes, precioKg, state._criterioPrecio || 'barra_completa', state.umbral_sobrante);
    const c = costos[abMem.id] || {};
    abMem.costo_perfiles = c.perfiles || 0;
    abMem.costo_vidrios  = c.vidrios  || 0;
    abMem.costo_herrajes = c.herrajes || 0;
    ab.costo_perfiles = abMem.costo_perfiles;
    ab.costo_vidrios  = abMem.costo_vidrios;
    ab.costo_herrajes = abMem.costo_herrajes;

    if (_editandoModId) {
      const idx = state.aberturas.findIndex(x => x.id === _editandoModId);
      if (idx >= 0) state.aberturas[idx] = abMem;
      await sheetsUpdateRow(SHEETS.aberturas, _editandoModId, ab);
      window._editandoModuloId = null;
      toast('Modulo actualizado');
    } else {
      state.aberturas.push(abMem);
      await sheetsAppend(SHEETS.aberturas, ab);
      toast('Modulo agregado');
    }
    await recalcularTotal();
    closeModal();
  } catch(e) {
    console.error('Error modulo:', e);
    toast('Error: ' + (e.message || e), 'error');
    const btn2 = document.getElementById('btnAgregarModulo');
    if (btn2) { btn2.disabled = false; btn2.textContent = 'Agregar modulo'; }
  } finally {
    render();
  }
}

function showEditAbertura(abId) {

  showAddAbertura();
}

        ${(state.tipos_vidrio&&state.tipos_vidrio.length?state.tipos_vidrio:[{id:'vcomon',nombre:'Vidrio Comun',tipo_base:'vcomon',precio:8500},{id:'dvh',nombre:'DVH',tipo_base:'dvh',precio:15000}]).map(tv=>'<option value="'+tv.id+'">'+tv.nombre+'</option>').join('')}
